<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dragon Tap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  #score {
    position: absolute; top: 16px; left: 0; right: 0; text-align: center;
    font-size: 44px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.25);
  }
  #hi-box, #coin-box {
    position: absolute; top: 14px; color: #fff; border-radius: 14px;
    padding: 8px 14px 9px; min-width: 78px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  #hi-box { left: 14px; background: rgba(58,36,88,.78); }
  #coin-box { right: 14px; background: rgba(140,90,20,.82); text-align: right; display: flex; align-items: center; gap: 6px; }
  .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; font-weight: 700; }
  .val { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .dcoin {
    display: inline-block; width: 1.15em; height: 1.15em; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff3b0, #f2c14a 42%, #c98a18 78%);
    box-shadow: inset 0 0 0 2px #8a5a10, 0 1px 2px rgba(0,0,0,.25);
    vertical-align: -0.2em; position: relative; flex-shrink: 0;
  }
  .dcoin::after {
    content: ""; position: absolute; left: 22%; top: 30%; width: 56%; height: 40%;
    background: #7a3d12; clip-path: polygon(20% 80%, 50% 0, 80% 80%, 50% 62%);
    border-radius: 2px; opacity: .85;
  }
  .item button .dcoin { width: 1em; height: 1em; margin-right: 6px; }
  #previewMeta .dcoin { width: 0.95em; height: 0.95em; margin: 0 4px; }
  #ui {
    position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #3a2a4a;
    pointer-events: none;
  }
  #ui.hidden { display: none; }
  h1 { font-size: 36px; font-weight: 800; }
  #msg { margin: 10px 16px 18px; font-size: 16px; opacity: .85; }
  #shopBtn {
    pointer-events: auto; border: 0; background: #3a2458; color: #fff;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 12px 22px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  #shop {
    position: fixed; inset: 0; z-index: 6; display: none; background: rgba(18,14,28,.55);
    align-items: stretch; justify-content: center; padding: 18px;
  }
  #shop.open { display: flex; }
  #panel {
    width: min(460px, 100%); margin: auto; max-height: 88vh; overflow-y: auto;
    background: #f7f1ff; color: #2a1d3a; border-radius: 22px; padding: 16px 16px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  #panel h2 { font-size: 22px; margin-bottom: 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button, .item button, #closeShop {
    border: 0; border-radius: 999px; padding: 8px 12px; font-weight: 700; cursor: pointer;
  }
  .tabs button { background: #e6d9f8; color: #3a2458; flex: 1; }
  .tabs button.on { background: #3a2458; color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item {
    background: #fff; border-radius: 16px; padding: 10px; text-align: left;
    box-shadow: 0 2px 0 rgba(58,36,88,.08);
  }
  .item .name { font-weight: 800; font-size: 14px; }
  .item .meta { font-size: 12px; opacity: .7; margin: 2px 0 8px; }
  .item button { background: #3a2458; color: #fff; width: 100%; }
  .item button.own { background: #6b4c9a; }
  .item button.eq { background: #2e8b57; }
  .item.locked { opacity: .72; }
  #closeShop { background: #eee; color: #333; width: 100%; margin-top: 12px; }
  .swatch { height: 28px; border-radius: 8px; margin-bottom: 6px; }
  #previewWrap {
    background: #2a1d3a; border-radius: 16px; padding: 8px; margin-bottom: 12px; text-align: center;
  }
  #preview { width: 100%; height: 96px; display: block; border-radius: 12px; background: #7ebbe8; }
  #previewMeta { color: #fff; font-size: 13px; margin-top: 6px; font-weight: 700; }
  #previewMeta .dc { opacity: .75; font-weight: 600; font-size: 11px; letter-spacing: .06em; }
  .item.sel { outline: 2px solid #3a2458; }
  .item .dc { font-size: 12px; font-weight: 800; color: #8a5a12; margin: 2px 0 8px; }
  .thumb { width: 100%; height: 78px; border-radius: 10px; display: block; margin-bottom: 6px; background: #cfe8f4; }
  #previewTag { color: #e6d9f8; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="hi-box"><div class="lbl">Best</div><div class="val" id="hi-val">0</div></div>
  <div id="score">0</div>
  <div id="coin-box"><span class="dcoin" title="Dragon coins"></span><div class="val" id="coin-val">0</div></div>
</div>
<div id="ui">
  <h1>Dragon Tap</h1>
  <p id="msg">Tap anywhere to fly</p>
  <button id="shopBtn" type="button">Shop</button>
</div>
<div id="shop">
  <div id="panel">
    <h2>Dragon Shop</h2>
    <div id="previewWrap">
      <div id="previewTag">Preview</div>
      <canvas id="preview" width="440" height="120"></canvas>
      <div id="previewMeta">Tap an item to preview</div>
    </div>
    <div class="tabs">
      <button class="on" data-tab="dragons">Dragons</button>
      <button data-tab="colors">Colors</button>
      <button data-tab="maps">Maps</button>
    </div>
    <div id="shopGrid" class="grid"></div>
    <button id="closeShop" type="button">Close</button>
  </div>
</div>
<script>
(function () {
  const canvas = document.getElementById("c");
  let ctx = canvas.getContext("2d");
  const ui = document.getElementById("ui");
  const msg = document.getElementById("msg");
  const scoreEl = document.getElementById("score");
  const hiEl = document.getElementById("hi-val");
  const coinEl = document.getElementById("coin-val");
  const shopEl = document.getElementById("shop");
  const shopGrid = document.getElementById("shopGrid");
  const preview = document.getElementById("preview");
  const previewCtx = preview.getContext("2d");
  const previewMeta = document.getElementById("previewMeta");
  const SAVE = "dragon-tap-save-v1";

  const DRAGONS = [
    { id: "pebble", name: "Pebble", price: 0, kind: "chubby" },
    { id: "pip", name: "Pip", price: 12, kind: "hatch" },
    { id: "nubbin", name: "Nubbin", price: 18, kind: "horn" },
    { id: "glim", name: "Glim", price: 24, kind: "moth" },
    { id: "noodle", name: "Noodle", price: 28, kind: "wyrm" },
    { id: "dumpling", name: "Dumpling", price: 32, kind: "puff" },
    { id: "ember", name: "Ember", price: 36, kind: "fire" },
    { id: "frost", name: "Frost", price: 36, kind: "ice" },
    { id: "sprout", name: "Sprout", price: 22, kind: "leaf" },
    { id: "bumble", name: "Bumble", price: 26, kind: "bee" },
    { id: "kelp", name: "Kelp", price: 30, kind: "gill" },
    { id: "cub", name: "Cub", price: 20, kind: "pup" },
    { id: "spike", name: "Spike", price: 34, kind: "armor" },
    { id: "silk", name: "Silk", price: 38, kind: "east" },
    { id: "zephyr", name: "Zephyr", price: 42, kind: "glide" },
    { id: "pearl", name: "Pearl", price: 44, kind: "orb" }
  ];
  const COLORS = [
    { id: "charcoal", name: "Charcoal", price: 0, body:"#2a2c33", belly:"#6d7380", wing:"#1c1e24", horn:"#4a4e58", eye:"#b6e04a", pupil:"#14200a", glow:"#7dffb0", blush:"#8a5460", tongue:"#e07a8a", tooth:"#f4f1ea", spot:"#5ee0c8" },
    { id: "sky", name: "Sky", price: 8, body:"#4aa3e8", belly:"#d8eefc", wing:"#2d7fc4", horn:"#f2c56b", eye:"#ff8a3d", pupil:"#3a1408", glow:"#ffe08a", blush:"#ff9aa8", tongue:"#ff6b86", tooth:"#fff", spot:"#fff3b0" },
    { id: "violet", name: "Violet", price: 8, body:"#8b6cff", belly:"#e4dcff", wing:"#6a48d4", horn:"#c9b6ff", eye:"#ffe36b", pupil:"#2a2208", glow:"#d4b8ff", blush:"#ff9ec4", tongue:"#ff7a9c", tooth:"#fff", spot:"#b8f0ff" },
    { id: "peach", name: "Peach", price: 8, body:"#f2c7a4", belly:"#fff4e6", wing:"#e0a57a", horn:"#c98b5c", eye:"#2eb8c9", pupil:"#062428", glow:"#9cf0e0", blush:"#f4a0a8", tongue:"#ee7a86", tooth:"#fff", spot:"#ffd6e8" },
    { id: "mint", name: "Mint", price: 10, body:"#3faf7a", belly:"#d4f3e0", wing:"#2d8a5c", horn:"#f0d56a", eye:"#ffb347", pupil:"#2a1806", glow:"#b8ff9a", blush:"#ef8fa0", tongue:"#e56b7c", tooth:"#fff", spot:"#fff1a0" },
    { id: "coral", name: "Coral", price: 10, body:"#f07878", belly:"#ffe4dc", wing:"#d45a5a", horn:"#ffd18a", eye:"#7dffd2", pupil:"#083028", glow:"#ffd36e", blush:"#ffb0c0", tongue:"#e85a78", tooth:"#fff", spot:"#ffe9a8" },
    { id: "banana", name: "Banana", price: 12, body:"#f2d14a", belly:"#fff6c8", wing:"#e0b020", horn:"#c98a18", eye:"#5b4dff", pupil:"#120c40", glow:"#fff1a0", blush:"#ff9aa8", tongue:"#ff6b86", tooth:"#fff", spot:"#fff" },
    { id: "ink", name: "Ink", price: 14, body:"#1a1428", belly:"#4a3d66", wing:"#120c1c", horn:"#c9b6ff", eye:"#7dffd2", pupil:"#042018", glow:"#b8f0ff", blush:"#8a5460", tongue:"#e07a8a", tooth:"#fff", spot:"#ff9ec4" },
    { id: "snow", name: "Snow", price: 14, body:"#eef3f8", belly:"#fff", wing:"#cfd8e6", horn:"#9ad4ff", eye:"#4aa3e8", pupil:"#0a2030", glow:"#b8f0ff", blush:"#ffb0c0", tongue:"#ff7a9c", tooth:"#fff", spot:"#c9b6ff" },
    { id: "ruby", name: "Ruby", price: 18, body:"#c42848", belly:"#ffd0d8", wing:"#8e1230", horn:"#ffd18a", eye:"#ffe36b", pupil:"#2a1806", glow:"#ff9aa8", blush:"#ffb0c0", tongue:"#ff6b86", tooth:"#fff", spot:"#fff1a0" },
    { id: "honey", name: "Honey", price: 12, body:"#e8a020", belly:"#fff0c4", wing:"#3a2a18", horn:"#5a3a14", eye:"#3a2458", pupil:"#120818", glow:"#ffe08a", blush:"#ff9aa8", tongue:"#e56b7c", tooth:"#fff", spot:"#fff" },
    { id: "sea", name: "Sea", price: 14, body:"#2a8f9a", belly:"#c8f4f0", wing:"#1a5c66", horn:"#9ad4c8", eye:"#ffe36b", pupil:"#2a1806", glow:"#7dffd2", blush:"#ff9ec4", tongue:"#ff7a9c", tooth:"#fff", spot:"#b8f0ff" },
    { id: "lilac", name: "Lilac", price: 12, body:"#c9a0d8", belly:"#f6e8ff", wing:"#8a6aaa", horn:"#ffe9a8", eye:"#4aa3e8", pupil:"#0a2030", glow:"#ffd4f0", blush:"#ff9ec4", tongue:"#ff7a9c", tooth:"#fff", spot:"#fff" }
  ];
  const MAPS = [
    { id: "dawn", name: "Dawn", price: 0, sky:["#7ebbe8","#f4cfe0"], grass:"#6bb86a", dirt:"#e0b56a", cloud:"rgba(255,255,255,.85)", pipe:"#6d52f2", cap:"#9b84ff" },
    { id: "night", name: "Aurora", price: 18, sky:["#0d1b33","#1a3d4a"], grass:"#245c48", dirt:"#2a3340", cloud:"rgba(180,220,255,.35)", pipe:"#3ee0c0", cap:"#7dffd2", stars:true },
    { id: "sunset", name: "Sunset", price: 16, sky:["#ff8a5b","#ffd1a8"], grass:"#7a9a3a", dirt:"#c98a48", cloud:"rgba(255,240,220,.7)", pipe:"#c45c2a", cap:"#f08a4a" },
    { id: "meadow", name: "Meadow", price: 14, sky:["#9ad4ff","#d8ffe8"], grass:"#4caf60", dirt:"#c4a06a", cloud:"rgba(255,255,255,.9)", pipe:"#3faf7a", cap:"#7ad49a" },
    { id: "storm", name: "Storm", price: 20, sky:["#4a5568","#8a9bb0"], grass:"#3d4a3a", dirt:"#5a5348", cloud:"rgba(220,228,240,.55)", pipe:"#5a6280", cap:"#8a94b0" },
    { id: "candy", name: "Candy", price: 22, sky:["#ffb3d9","#ffe9a8"], grass:"#7dffb0", dirt:"#ffd1a8", cloud:"rgba(255,255,255,.9)", pipe:"#ff6b9a", cap:"#ff9ec4" },
    { id: "lava", name: "Emberfall", price: 26, sky:["#3a1020","#c45c2a"], grass:"#5a2a18", dirt:"#3a1c14", cloud:"rgba(255,180,80,.25)", pipe:"#e85a2a", cap:"#ffd36e" }
  ];

  let save = load();
  function load() {
    try { return JSON.parse(localStorage.getItem(SAVE) || ""); } catch (e) { return null; }
  }
  if (!save) save = { coins: 0, hi: Number(localStorage.getItem("dragon-tap-hi") || 0), ownedD: ["pebble"], ownedC: ["charcoal"], ownedM: ["dawn"], d: "pebble", c: "charcoal", m: "dawn" };
  function persist() { localStorage.setItem(SAVE, JSON.stringify(save)); }
  function dragon() { return DRAGONS.find(x => x.id === save.d) || DRAGONS[0]; }
  function color() { return COLORS.find(x => x.id === save.c) || COLORS[0]; }
  function map() { return MAPS.find(x => x.id === save.m) || MAPS[0]; }

  let W = 0, H = 0, dpr = 1, groundY = 0;
  let state = "ready";
  let last = 0;
  let bird, pipes, parts, coins, extras;
  let score = 0, wing = 0, wingPhase = 0, scroll = 0, shopOpen = false, shopTab = "dragons", shopPick = null;
  const GAP = 190, PW = 70, SPEED0 = 200, GRAV = 1600, FLAP = -460;

  hiEl.textContent = String(save.hi);
  coinEl.textContent = String(save.coins);

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = H - 90;
    if (bird) { bird.x = W * 0.3; bird.y = Math.min(bird.y, groundY - 20); }
  }
  window.addEventListener("resize", size);
  size();

  function pickPal(avoidId) {
    const pool = COLORS.filter(p => p.id !== avoidId);
    return pool[(Math.random() * pool.length) | 0];
  }

  function reset() {
    bird = { x: W * 0.3, y: H * 0.42, vy: 0, rot: 0 };
    pipes = []; parts = []; coins = []; extras = [];
    score = 0; scroll = 0; wing = 0;
    scoreEl.textContent = "0";
    pipes.push(makePipe(W + 80));
    pipes.push(makePipe(W + 80 + Math.max(220, W * 0.45)));
    for (let i = 0; i < 3; i++) {
      extras.push({
        x: W * (0.55 + i * 0.28), y: 70 + (i * 97) % Math.max(120, H * 0.4),
        s: 0.5 + i * 0.08, pal: pickPal(save.c), kind: DRAGONS[(i + 1) % DRAGONS.length].kind,
        flap: Math.random(), vx: 18 + i * 10
      });
    }
  }

  function makePipe(x) {
    const min = 80, max = Math.max(min + 10, groundY - GAP - 80);
    const top = min + Math.random() * (max - min);
    if (Math.random() < 0.7) coins.push({ x: x + PW / 2, y: top + GAP / 2, r: 12, got: false });
    return { x, top, passed: false };
  }

  function flap(e) {
    if (shopOpen) return;
    if (e && e.target && (e.target.closest && (e.target.closest("#shop") || e.target.closest("#shopBtn")))) return;
    if (e) e.preventDefault();
    if (state === "ready" || state === "dead") {
      reset();
      state = "play";
      ui.classList.add("hidden");
    }
    if (state === "play") { bird.vy = FLAP; wing = 1; }
  }

  function die() {
    if (state !== "play") return;
    state = "dead";
    save.hi = Math.max(save.hi, score);
    persist();
    hiEl.textContent = String(save.hi);
    ui.classList.remove("hidden");
    msg.textContent = "Ouch. " + score + "  ·  best " + save.hi + ". Tap again.";
    for (let i = 0; i < 16; i++) {
      parts.push({ x: bird.x, y: bird.y, vx: (Math.random() - 0.5) * 240, vy: (Math.random() - 0.7) * 240, life: 0.5, c: ["#ffd4e5","#c9b6ff","#fff1a8"][i % 3] });
    }
  }

  function addCoins(n) {
    save.coins += n;
    persist();
    coinEl.textContent = String(save.coins);
  }

  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }


  function drawChibi(pal, flapAmt, kind) {
    const k = kind || "chubby";
    const L = {
      chubby: { bw:14.5, bh:12.5, head:13.6, span:30, wing:"bat", tail:"stub", horn:"short", ear:"round" },
      hatch:  { bw:10.5, bh:9.5, head:16.8, span:20, wing:"bat", tail:"stub", horn:"none", ear:"big" },
      horn:   { bw:14, bh:12, head:13, span:28, wing:"bat", tail:"stub", horn:"long", ear:"tiny" },
      moth:   { bw:13, bh:11, head:13, span:36, wing:"moth", tail:"fluff", horn:"ant", ear:"none" },
      wyrm:   { bw:20, bh:8.5, head:11, span:16, wing:"tiny", tail:"long", horn:"nub", ear:"none" },
      puff:   { bw:17.5, bh:16, head:14, span:18, wing:"tiny", tail:"fluff", horn:"nub", ear:"round" },
      fire:   { bw:14.5, bh:12, head:13, span:30, wing:"bat", tail:"flame", horn:"short", ear:"round" },
      ice:    { bw:14.5, bh:12, head:13, span:28, wing:"crystal", tail:"ice", horn:"crystal", ear:"tiny" },
      leaf:   { bw:13.5, bh:12, head:13, span:26, wing:"leaf", tail:"leaf", horn:"none", ear:"leaf" },
      bee:    { bw:12, bh:11, head:12, span:22, wing:"moth", tail:"stub", horn:"ant", ear:"none" },
      gill:   { bw:15, bh:10, head:12.5, span:0, wing:"none", tail:"fin", horn:"none", ear:"gill" },
      pup:    { bw:14, bh:12.5, head:14.5, span:24, wing:"tiny", tail:"stub", horn:"none", ear:"flop" },
      armor:  { bw:15, bh:13, head:13, span:28, wing:"bat", tail:"spike", horn:"long", ear:"tiny" },
      east:   { bw:18, bh:9.5, head:12, span:22, wing:"tiny", tail:"long", horn:"nub", ear:"none" },
      glide:  { bw:13, bh:10, head:12.5, span:40, wing:"bat", tail:"fin", horn:"short", ear:"tiny" },
      orb:    { bw:16, bh:15.5, head:12, span:14, wing:"tiny", tail:"stub", horn:"nub", ear:"round" }
    }[k] || { bw:14.5, bh:12.5, head:13.6, span:30, wing:"bat", tail:"stub", horn:"short", ear:"round" };

    function batWing(mirror, size, phaseOff, style) {
      if (style === "none" || size <= 0) return;
      const lift = Math.sin((flapAmt + phaseOff) * Math.PI * 2) * 0.75;
      ctx.save();
      ctx.translate(-5, 3);
      ctx.scale(mirror, 1);
      ctx.rotate(-0.72 + lift);
      ctx.fillStyle = pal.wing;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      if (style === "moth" || style === "leaf") {
        ctx.quadraticCurveTo(-size * 0.15, -size * 0.85, -size * 0.75, -size * 0.35);
        ctx.quadraticCurveTo(-size * 1.05, size * 0.05, -size * 0.35, size * 0.35);
      } else if (style === "tiny") {
        ctx.quadraticCurveTo(-size * 0.2, -size * 0.4, -size * 0.7, 0);
        ctx.quadraticCurveTo(-size * 0.4, size * 0.25, 0, 4);
      } else if (style === "crystal") {
        ctx.lineTo(-size * 0.4, -size * 0.55);
        ctx.lineTo(-size, -size * 0.05);
        ctx.lineTo(-size * 0.35, size * 0.22);
      } else {
        ctx.quadraticCurveTo(-size * 0.22, -size * 0.62, -size, -size * 0.05);
        ctx.quadraticCurveTo(-size * 0.68, size * 0.28, -size * 0.12, size * 0.2);
      }
      ctx.closePath(); ctx.fill();
      if (style === "leaf") {
        ctx.strokeStyle = pal.glow; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-size * 0.7, -size * 0.1); ctx.stroke();
      } else {
        ctx.strokeStyle = pal.glow; ctx.globalAlpha = 0.65; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-size * 0.9, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-size * 0.55, size * 0.14); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
    batWing(1, L.span, 0, L.wing);
    if (L.wing !== "none") batWing(0.92, L.span * 0.88, 0.12, L.wing);

    // tail
    ctx.lineCap = "round";
    if (L.tail === "long") {
      ctx.strokeStyle = pal.body; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(-12, 8); ctx.quadraticCurveTo(-28, 4, -38, 14); ctx.stroke();
      ctx.fillStyle = pal.body; ellipse(-40, 15, 4.5, 4); ctx.fill();
      if (k === "east") {
        ctx.strokeStyle = pal.glow; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(18, 6); ctx.quadraticCurveTo(28, 2, 34, 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(18, 8); ctx.quadraticCurveTo(30, 12, 36, 10); ctx.stroke();
      }
    } else if (L.tail === "flame") {
      ctx.fillStyle = "#ff9a4a";
      ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-26, 6); ctx.lineTo(-22, 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffe08a"; ellipse(-16, 11, 3, 2.4); ctx.fill();
    } else if (L.tail === "ice") {
      ctx.fillStyle = "#b8f0ff";
      ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-24, 4); ctx.lineTo(-20, 16); ctx.closePath(); ctx.fill();
    } else if (L.tail === "fluff") {
      ctx.fillStyle = pal.body; ellipse(-16, 14, 7, 6); ctx.fill();
      ctx.fillStyle = pal.belly; ellipse(-16, 14, 4, 3.4); ctx.fill();
    } else if (L.tail === "fin") {
      ctx.fillStyle = pal.wing;
      ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-24, 4); ctx.lineTo(-22, 18); ctx.closePath(); ctx.fill();
    } else if (L.tail === "leaf") {
      ctx.fillStyle = pal.glow;
      ctx.beginPath(); ctx.ellipse(-18, 14, 7, 4, -0.5, 0, Math.PI * 2); ctx.fill();
    } else if (L.tail === "spike") {
      ctx.fillStyle = pal.horn;
      ctx.beginPath(); ctx.moveTo(-8, 10); ctx.lineTo(-22, 6); ctx.lineTo(-12, 16); ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = pal.body; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(-10, 10); ctx.quadraticCurveTo(-15, 12, -17, 16); ctx.stroke();
      ctx.fillStyle = pal.body; ellipse(-18, 17.5, 5.2, 4.6); ctx.fill();
    }

    // legs
    ctx.fillStyle = pal.body;
    ellipse(-10, 20, k === "wyrm" ? 3.5 : 6.2, k === "wyrm" ? 3 : 5.2, 0.3); ctx.fill();
    ellipse(10, 20.5, k === "wyrm" ? 3.5 : 6.4, k === "wyrm" ? 3 : 5.3, -0.25); ctx.fill();
    ctx.fillStyle = pal.belly;
    ellipse(-12, 22, 1.6, 1.3); ctx.fill();
    ellipse(12, 22.2, 1.6, 1.3); ctx.fill();

    // arms skip for wyrm/gill tiny
    if (k !== "wyrm" && k !== "gill") {
      ctx.fillStyle = pal.body;
      ellipse(-15, 7.5, 5.6, 3.4, 0.55); ctx.fill();
      ellipse(15, 8.5, 5.6, 3.4, -0.5); ctx.fill();
    }

    // body
    ctx.fillStyle = pal.body;
    ellipse(0, 7, L.bw, L.bh); ctx.fill();
    if (k === "bee") {
      ctx.fillStyle = pal.horn;
      ctx.fillRect(-L.bw + 4, 4, 5, L.bh); ctx.fillRect(2, 4, 5, L.bh);
    }
    ctx.fillStyle = pal.belly;
    ellipse(1.5, 10, L.bw * 0.55, L.bh * 0.55); ctx.fill();
    if (k === "armor") {
      ctx.fillStyle = pal.horn;
      ellipse(-5, 1, 2.2, 3.4); ctx.fill();
      ellipse(1, -1, 2.4, 3.8); ctx.fill();
      ellipse(7, 1, 2.2, 3.4); ctx.fill();
    }
    ctx.fillStyle = pal.spot; ctx.globalAlpha = 0.85;
    ellipse(-6, 2, 1.8, 1.6); ctx.fill();
    ellipse(5, 3, 1.2, 1.1); ctx.fill();
    ctx.globalAlpha = 1;

    // horns / ears
    ctx.fillStyle = pal.horn;
    if (L.horn === "long") {
      ellipse(9, -21, 3, 8, -0.28); ctx.fill();
      ellipse(19, -22, 2.8, 7.6, 0.32); ctx.fill();
    } else if (L.horn === "crystal") {
      ctx.beginPath(); ctx.moveTo(10, -12); ctx.lineTo(8, -24); ctx.lineTo(14, -12); ctx.fill();
      ctx.beginPath(); ctx.moveTo(18, -12); ctx.lineTo(20, -25); ctx.lineTo(23, -12); ctx.fill();
    } else if (L.horn === "ant") {
      ctx.strokeStyle = pal.horn; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(10, -12); ctx.lineTo(8, -22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(18, -12); ctx.lineTo(22, -22); ctx.stroke();
    } else if (L.horn === "nub") {
      ellipse(10, -15, 2.2, 3.2); ctx.fill();
      ellipse(17, -15.5, 2.2, 3.2); ctx.fill();
    } else if (L.horn === "short") {
      ellipse(10, -17.5, 2.8, 5.2, -0.2); ctx.fill();
      ellipse(18, -18, 2.6, 5, 0.25); ctx.fill();
    }

    ctx.fillStyle = pal.body;
    if (L.ear === "flop") {
      ellipse(5, -8, 5.5, 3.4, 0.6); ctx.fill();
      ellipse(20, -9, 5.5, 3.4, -0.5); ctx.fill();
    } else if (L.ear === "big") {
      ellipse(6, -12, 4.6, 6, -0.4); ctx.fill();
      ellipse(20, -13, 4.4, 5.8, 0.4); ctx.fill();
    } else if (L.ear === "gill") {
      ctx.fillStyle = pal.blush;
      ellipse(6, 2, 4, 6, 0.4); ctx.fill();
      ellipse(8, 0, 3, 5, 0.5); ctx.fill();
    } else if (L.ear === "leaf") {
      ctx.fillStyle = pal.glow;
      ellipse(6, -12, 4, 6, -0.5); ctx.fill();
      ellipse(20, -12, 4, 6, 0.5); ctx.fill();
    } else if (L.ear === "round") {
      ellipse(7.2, -11, 3.8, 4.6, -0.5); ctx.fill();
      ellipse(19, -12, 3.6, 4.4, 0.35); ctx.fill();
      ctx.fillStyle = pal.blush;
      ellipse(7.3, -11, 1.7, 2.3, -0.5); ctx.fill();
      ellipse(18.8, -12, 1.6, 2.2, 0.35); ctx.fill();
    }

    // head
    ctx.fillStyle = pal.body;
    ellipse(13.5, -1.5, L.head, L.head * 0.92, 0.06); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.1)";
    ellipse(8, -5.5, 5.5, 3.8, -0.4); ctx.fill();
    ctx.fillStyle = pal.body;
    ellipse(23, 4.2, k === "hatch" ? 6.5 : 8, 6, 0.12); ctx.fill();
    ctx.fillStyle = pal.tooth;
    ctx.beginPath(); ctx.moveTo(21, 5.6); ctx.lineTo(22.2, 8); ctx.lineTo(23.4, 5.6); ctx.fill();
    ctx.fillStyle = pal.tongue;
    ellipse(27, 8, 2.6, 1.8, 0.25); ctx.fill();

    ctx.fillStyle = "#f7f4ea";
    ellipse(16.4, -2.4, 5.3, 5.9, -0.12); ctx.fill();
    ctx.fillStyle = pal.eye;
    ellipse(16.9, -2.2, 3.4, 4.2, -0.12); ctx.fill();
    ctx.fillStyle = pal.pupil;
    ellipse(17.1, -2.1, 0.95, 2.7, -0.12); ctx.fill();
    ctx.fillStyle = "#fff";
    ellipse(18.2, -3.7, 1.25, 1.45); ctx.fill();
    ctx.strokeStyle = pal.body; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(16.4, -2.6, 4.8, Math.PI * 1.05, Math.PI * 1.82); ctx.stroke();
    ctx.fillStyle = pal.blush; ctx.globalAlpha = 0.55;
    ellipse(11.2, 3.6, 3.6, 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawDragonAt(x, y, rot, s, pal, flapAmt, kind) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.scale(s, s);
    drawChibi(pal, flapAmt, kind);
    ctx.restore();
  }

  function sky() {
    const m = liveMap();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, m.sky[0]); g.addColorStop(1, m.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (m.stars) {
      ctx.fillStyle = "rgba(255,255,255,.7)";
      for (let i = 0; i < 28; i++) ctx.fillRect((i * 97 + scroll * 0.05) % W, (i * 53) % (H * 0.55), 2, 2);
    }
    ctx.fillStyle = m.cloud;
    const x = ((scroll * 0.2) % (W + 180)) - 90;
    ellipse(x, 80, 50, 18); ctx.fill();
    ellipse(x + 160, 130, 40, 14); ctx.fill();
  }
  function ground() {
    const m = liveMap();
    ctx.fillStyle = m.grass; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = m.dirt; ctx.fillRect(0, groundY + 12, W, H);
  }
  function drawPipes() {
    const m = liveMap();
    for (const p of pipes) {
      ctx.fillStyle = m.pipe;
      ctx.fillRect(p.x, 0, PW, p.top);
      ctx.fillRect(p.x, p.top + GAP, PW, groundY - (p.top + GAP));
      ctx.fillStyle = m.cap;
      ctx.fillRect(p.x - 6, p.top - 24, PW + 12, 24);
      ctx.fillRect(p.x - 6, p.top + GAP, PW + 12, 24);
    }
  }
  function drawCoins() {
    for (const c of coins) {
      if (c.got) continue;
      ctx.fillStyle = "#f2c14a";
      ellipse(c.x, c.y, c.r, c.r); ctx.fill();
      ctx.fillStyle = "#ffe08a";
      ellipse(c.x - 2, c.y - 2, c.r * 0.45, c.r * 0.45); ctx.fill();
      ctx.fillStyle = "#c98a18";
      ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("D", c.x, c.y + 1);
    }
  }

  function tick(ts) {
    const dt = Math.min(0.033, last ? (ts - last) / 1000 : 0.016);
    last = ts;
    if (wing > 0) wing = Math.max(0, wing - dt * 3);
    wingPhase = (wingPhase + dt * (2.6 + wing * 3)) % 1;
    if (!bird) reset();

    if (state === "play") {
      bird.vy += GRAV * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.max(-0.5, Math.min(1, bird.vy / 700));
      scroll += SPEED0 * dt;
      const spd = SPEED0 + Math.min(140, score * 6);
      for (const p of pipes) {
        p.x -= spd * dt;
        if (!p.passed && p.x + PW < bird.x) { p.passed = true; score += 1; scoreEl.textContent = String(score); }
      }
      for (const c of coins) {
        c.x -= spd * dt;
        if (!c.got && Math.hypot(c.x - bird.x, c.y - bird.y) < 28) { c.got = true; addCoins(1); }
      }
      if (pipes[0] && pipes[0].x < -PW - 20) {
        pipes.shift();
        pipes.push(makePipe(pipes[pipes.length - 1].x + Math.max(220, W * 0.45)));
      }
      if (bird.y + 16 > groundY || bird.y < 12) die();
      for (const p of pipes) {
        if (bird.x + 16 > p.x && bird.x - 14 < p.x + PW) {
          if (bird.y - 14 < p.top || bird.y + 14 > p.top + GAP) die();
        }
      }
    } else if (state === "ready") {
      bird.y = H * 0.42 + Math.sin(ts / 280) * 10;
      bird.rot = 0;
      /* idle flap via wingPhase */
      scroll += 50 * dt;
    } else {
      bird.vy += GRAV * dt;
      bird.y = Math.min(groundY - 12, bird.y + bird.vy * dt);
      bird.rot = Math.min(1.2, bird.rot + dt * 2.5);
      scroll += 20 * dt;
    }

    for (const e of extras) {
      e.x -= (state === "play" ? 40 : 16) * dt + e.vx * dt * 0.2;
      e.y += Math.sin((ts / 400) + e.s) * 12 * dt;
      e.flap = (e.flap + dt * 2.4) % 1;
      if (e.x < -80) {
        e.x = W + 60; e.y = 60 + Math.random() * (groundY - 140);
        e.pal = pickPal(save.c); e.kind = DRAGONS[(Math.random() * DRAGONS.length) | 0].kind;
      }
    }
    for (const s of parts) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 420 * dt; s.life -= dt; }
    parts = parts.filter(s => s.life > 0);

    sky();
    for (const e of extras) drawDragonAt(e.x, e.y, -0.15, e.s, e.pal, e.flap, e.kind);
    drawPipes();
    drawCoins();
    ground();
    drawDragonAt(bird.x, bird.y, bird.rot, 0.82, livePal(), wingPhase, liveKind());
    for (const s of parts) {
      ctx.globalAlpha = Math.max(0, s.life * 2);
      ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, 4, 4); ctx.globalAlpha = 1;
    }
    drawShopPreview();
    requestAnimationFrame(tick);
  }

  function livePal() {
    if (shopOpen && shopTab === "colors") return currentPreview();
    return color();
  }
  function liveKind() {
    if (shopOpen && shopTab === "dragons") return currentPreview().kind;
    return dragon().kind;
  }
  function liveMap() {
    if (shopOpen && shopTab === "maps") return currentPreview();
    return map();
  }
  function currentPreview() {
    const items = shopTab === "dragons" ? DRAGONS : shopTab === "colors" ? COLORS : MAPS;
    if (shopPick && shopPick.tab === shopTab) {
      return items.find(x => x.id === shopPick.id) || items[0];
    }
    return items.find(x => x.id === (shopTab === "dragons" ? save.d : shopTab === "colors" ? save.c : save.m)) || items[0];
  }
  function drawShopPreview() {
    if (!shopOpen) return;
    const pw = preview.width, ph = preview.height;
    const it = currentPreview();
    const pal = shopTab === "colors" ? it : color();
    const kind = shopTab === "dragons" ? it.kind : dragon().kind;
    const mp = shopTab === "maps" ? it : map();
    const keep = ctx;
    ctx = previewCtx;
    const g = ctx.createLinearGradient(0, 0, 0, ph);
    g.addColorStop(0, mp.sky[0]); g.addColorStop(1, mp.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, pw, ph);
    ctx.fillStyle = mp.grass; ctx.fillRect(0, ph - 28, pw, 28);
    ctx.fillStyle = mp.dirt; ctx.fillRect(0, ph - 16, pw, 16);
    drawDragonAt(pw * 0.48, ph * 0.55, 0, 1.55, pal, wingPhase, kind);
    ctx = keep;
    const ownedKey = shopTab === "dragons" ? "ownedD" : shopTab === "colors" ? "ownedC" : "ownedM";
    const owned = save[ownedKey].includes(it.id);
    if (owned) previewMeta.innerHTML = it.name + " <span class='dc'>owned</span>";
    else previewMeta.innerHTML = it.name + ' · <span class="dcoin"></span> ' + it.price;
  }

  function paintThumb(cv, it) {
    const keep = ctx;
    ctx = cv.getContext("2d");
    const w = cv.width, h = cv.height;
    const pal = shopTab === "colors" ? it : color();
    const kind = shopTab === "dragons" ? it.kind : dragon().kind;
    const mp = shopTab === "maps" ? it : map();
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, mp.sky[0]); g.addColorStop(1, mp.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = mp.grass; ctx.fillRect(0, h - 18, w, 18);
    drawDragonAt(w * 0.5, h * 0.55, 0, 1.15, pal, 0.35, kind);
    ctx = keep;
  }
  function renderShop() {
    const items = shopTab === "dragons" ? DRAGONS : shopTab === "colors" ? COLORS : MAPS;
    const ownedKey = shopTab === "dragons" ? "ownedD" : shopTab === "colors" ? "ownedC" : "ownedM";
    const eqKey = shopTab === "dragons" ? "d" : shopTab === "colors" ? "c" : "m";
    if (!shopPick || shopPick.tab !== shopTab) shopPick = { tab: shopTab, id: save[eqKey] };
    shopGrid.innerHTML = "";
    for (const it of items) {
      const owned = save[ownedKey].includes(it.id);
      const eq = save[eqKey] === it.id;
      const sel = shopPick && shopPick.id === it.id;
      const div = document.createElement("div");
      div.className = "item" + (owned ? "" : " locked") + (sel ? " sel" : "");
      const swatch = document.createElement("div");
      swatch.className = "swatch";
      if (shopTab === "colors") swatch.style.background = it.body;
      else if (shopTab === "maps") swatch.style.background = "linear-gradient(180deg," + it.sky[0] + "," + it.sky[1] + ")";
      else swatch.style.background = color().body;
      const thumb = document.createElement("canvas");
      thumb.className = "thumb"; thumb.width = 240; thumb.height = 120;
      const name = document.createElement("div"); name.className = "name"; name.textContent = it.name;
      const dc = document.createElement("div"); dc.className = "dc";
      dc.textContent = owned ? (eq ? "Equipped" : "Owned") : "Preview";
      const btn = document.createElement("button");
      if (eq) { btn.textContent = "Wearing"; btn.className = "eq"; }
      else if (owned) { btn.textContent = "Use"; btn.className = "own"; }
      else { btn.innerHTML = '<span class="dcoin"></span>' + it.price; }
      function selectOnly() { shopPick = { tab: shopTab, id: it.id }; renderShop(); }
      div.onclick = function (e) {
        if (e.target.closest("button")) return;
        selectOnly();
      };
      btn.onclick = function (e) {
        e.stopPropagation();
        if (!owned) {
          if (!sel) { selectOnly(); return; }
          if (save.coins >= it.price) {
            save.coins -= it.price; save[ownedKey].push(it.id); save[eqKey] = it.id;
            persist(); coinEl.textContent = String(save.coins); renderShop();
          } else {
            dc.innerHTML = "Need <span class='dcoin'></span> " + it.price;
          }
          return;
        }
        save[eqKey] = it.id; persist(); renderShop();
      };
      div.appendChild(thumb);
      div.appendChild(name); div.appendChild(dc); div.appendChild(btn);
      shopGrid.appendChild(div);
      paintThumb(thumb, it);
    }
  }

  document.getElementById("shopBtn").addEventListener("pointerdown", function (e) { e.stopPropagation(); e.preventDefault(); });
  document.getElementById("shopBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    shopOpen = true; shopEl.classList.add("open"); renderShop();
  });
  document.getElementById("closeShop").addEventListener("click", function () {
    shopOpen = false; shopEl.classList.remove("open");
  });
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      shopTab = b.getAttribute("data-tab");
      document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
      renderShop();
    });
  });

  reset();
  requestAnimationFrame(tick);

  const opts = { passive: false };
  window.addEventListener("pointerdown", flap, opts);
  window.addEventListener("touchstart", flap, opts);
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === "ArrowUp" || e.key === "Enter") { e.preventDefault(); flap(); }
  });
})();
</script>
</body>
</html>
