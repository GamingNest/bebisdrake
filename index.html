<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#080616"><title>Dragon Tap — GamingNest</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080616;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}#menu{background:radial-gradient(circle at 50% 25%,#39255f 0,#150d2c 40%,#080616 78%)}.wrap{height:100%;max-width:760px;margin:auto;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.brand{font-weight:900;letter-spacing:4px;font-size:14px;opacity:.75}.title{font-size:clamp(42px,13vw,78px);font-weight:1000;line-height:.9;text-align:center;margin:0}.subtitle{text-align:center;opacity:.7;margin-bottom:12px}.stats{display:flex;gap:10px;width:min(430px,100%)}.stat{flex:1;background:#ffffff12;border:1px solid #ffffff16;border-radius:16px;padding:10px;text-align:center}.stat small{display:block;opacity:.55;font-size:11px}.stat b{font-size:22px}.menuBtn{width:min(430px,100%);padding:15px;border:0;border-radius:17px;background:#ffffff12;color:#fff;font-weight:900;letter-spacing:1px;border:1px solid #ffffff18}.menuBtn.primary{background:linear-gradient(135deg,#9b5cff,#5c38ff);box-shadow:0 10px 30px #6b3dff44}.note{font-size:12px;opacity:.45;text-align:center}#game{background:#0b1430}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:max(16px,env(safe-area-inset-top));left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#080616aa;border:1px solid #ffffff18;backdrop-filter:blur(10px);padding:9px 13px;border-radius:14px;font-weight:900}#gameHint{position:absolute;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));text-align:center;opacity:.55;font-size:13px;pointer-events:none}.panel{position:absolute;inset:0;background:#080616f5;display:none;z-index:5;overflow:auto}.panel.show{display:block}.panelInner{max-width:760px;margin:auto;padding:28px 20px 40px}.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel h2{margin:0;font-size:30px}.close{border:0;background:#ffffff12;color:#fff;border-radius:12px;padding:10px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#ffffff0c;border:1px solid #ffffff14;border-radius:18px;padding:14px}.card.locked{opacity:.55}.preview{height:130px;border-radius:14px;background:radial-gradient(circle,#312052,#120d24);display:flex;align-items:center;justify-content:center;margin-bottom:10px}.preview canvas{width:100%;height:100%;max-height:130px}.card h3{margin:5px 0;font-size:17px}.card p{margin:0 0 10px;opacity:.55;font-size:12px}.card button{width:100%;padding:10px;border:0;border-radius:12px;background:#ffffff14;color:#fff;font-weight:800}.card button.buy{background:#7046ff}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><div id="app"><section id="menu" class="screen active"><div class="wrap"><div class="brand">GAMINGNEST PRESENTS</div><h1 class="title">🐉<br>DRAGON TAP</h1><div class="subtitle">Tap to fly. Dodge the gates. Collect the coins.<br>Flappy Edition</div><div class="stats"><div class="stat"><small>BEST</small><b id="best">0</b></div><div class="stat"><small>COINS</small><b id="coins">0</b></div></div><button class="menuBtn primary" id="play">▶ PLAY</button><button class="menuBtn" id="shop">🛒 SHOP</button><button class="menuBtn" id="customize">✨ CUSTOMIZE</button><button class="menuBtn" id="sound">🔊 SOUND</button><button class="menuBtn" id="reset">↻ RESET</button><div class="note">Each dragon has a unique silhouette, horns, wings, tail and markings.</div></div></section><section id="game" class="screen"><canvas id="gameCanvas"></canvas><div class="hud"><div class="pill">🏆 <span id="score">0</span></div><div class="pill">🪙 <span id="gameCoins">0</span></div></div><div id="gameHint">TAP / CLICK TO FLY</div><div id="gameOver" class="panel"><div class="wrap"><div class="brand">RUN OVER</div><h2 style="font-size:48px;margin:0">🐉 GAME OVER</h2><div class="stats"><div class="stat"><small>SCORE</small><b id="finalScore">0</b></div><div class="stat"><small>COINS</small><b id="finalCoins">0</b></div></div><button class="menuBtn primary" id="again">↻ PLAY AGAIN</button><button class="menuBtn" id="backMenu">⌂ MAIN MENU</button></div></div></section><div id="collection" class="panel"><div class="panelInner"><div class="panelHead"><h2>🐉 Dragons</h2><button class="close" onclick="closePanels()">✕</button></div><div id="dragonGrid" class="grid"></div></div></div></div><script>
const $=id=>document.getElementById(id);const key="dragonTapGamingNestV2";let data=JSON.parse(localStorage.getItem(key)||"null")||{coins:2000000,best:0,sound:true,selected:"ember",owned:["ember"]};function save(){localStorage.setItem(key,JSON.stringify(data));updateStats()}function updateStats(){$("coins").textContent=data.coins.toLocaleString();$("best").textContent=data.best}updateStats();
const dragons=[{id:"ember",name:"Ember Dragon",price:0,body:"#d94732",wing:"#ff8b32",horn:"#ffd27a",eye:"#fff0a8",accent:"#ffb13b",desc:"Lean fire dragon with swept horns and a jagged tail."},{id:"forest",name:"Forest Dragon",price:500,body:"#3e9b55",wing:"#7bc96f",horn:"#c8a66a",eye:"#dfffb5",accent:"#b9e47b",desc:"Rounder silhouette with branch-like horns and leaf wings."},{id:"frost",name:"Frost Dragon",price:900,body:"#73cfe6",wing:"#c7f7ff",horn:"#dffcff",eye:"#ffffff",accent:"#8eeeff",desc:"Crystal wings, long horns and icy markings."},{id:"storm",name:"Storm Dragon",price:1400,body:"#6655b8",wing:"#9a8cff",horn:"#d5d0ff",eye:"#f3f0ff",accent:"#bdb4ff",desc:"Powerful body, sharp wings and lightning stripes."},{id:"shadow",name:"Shadow Dragon",price:2200,body:"#302a3c",wing:"#5d506f",horn:"#b69be8",eye:"#ff5cff",accent:"#a864ff",desc:"Thin dark silhouette with glowing eyes and torn wings."},{id:"tide",name:"Tide Dragon",price:3000,body:"#287ca8",wing:"#51b9d5",horn:"#b9e8ee",eye:"#eaffff",accent:"#72e6ff",desc:"Streamlined sea dragon with fin-like tail details."},{id:"ancient",name:"Ancient Dragon",price:6000,body:"#a56b32",wing:"#d59b4e",horn:"#f4d49b",eye:"#ffe9a8",accent:"#e7bb64",desc:"Heavy armored silhouette with old carved markings."},{id:"celestial",name:"Celestial Dragon",price:0,exclusive:true,body:"#d7c8ff",wing:"#fff6cf",horn:"#fff",eye:"#fff",accent:"#c9a6ff",desc:"EXCLUSIVE — unique celestial design and aura."}];
const cvs=$("gameCanvas"),ctx=cvs.getContext("2d");let W=0,H=0,playing=false,last=0,dragonY=0,vel=0,score=0,runCoins=0,t=0,pipes=[],coinsOnMap=[];function resize(){const s=devicePixelRatio||1;W=innerWidth;H=innerHeight;cvs.width=W*s;cvs.height=H*s;ctx.setTransform(s,0,0,s,0,0)}addEventListener("resize",resize);resize();function dragonDef(){return dragons.find(d=>d.id===data.selected)||dragons[0]}
function drawDragon(c,x,y,s=1,angle=0){const d=dragonDef();c.save();c.translate(x,y);c.rotate(angle);c.fillStyle=d.body;c.beginPath();c.ellipse(0,0,31*s,20*s,0,0,Math.PI*2);c.fill();c.fillStyle=d.accent;c.beginPath();c.ellipse(8,5,18*s,10*s,0,0,Math.PI*2);c.fill();c.strokeStyle=d.body;c.lineWidth=15*s;c.lineCap="round";c.beginPath();c.moveTo(18,-4);c.quadraticCurveTo(27,-15,34,-25);c.stroke();c.fillStyle=d.body;c.beginPath();c.ellipse(38,-29,17*s,13*s,0,0,Math.PI*2);c.fill();c.strokeStyle=d.horn;c.lineWidth=5*s;c.beginPath();c.moveTo(32,-39);c.lineTo(25,-51);c.moveTo(42,-40);c.lineTo(45,-53);c.stroke();c.fillStyle=d.eye;c.beginPath();c.arc(44,-31,3.5*s,0,Math.PI*2);c.fill();c.fillStyle="#160c22";c.beginPath();c.arc(45,-31,1.5*s,0,Math.PI*2);c.fill();const flap=Math.sin(t*7+d.id.length)*.18;c.save();c.translate(-9,-13);c.rotate(-.55-flap);c.fillStyle=d.wing;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-15,-48,-48,-42);c.quadraticCurveTo(-35,-13,-5,13);c.closePath();c.fill();c.strokeStyle=d.accent;c.lineWidth=2*s;c.stroke();c.restore();c.save();c.translate(-2,-12);c.rotate(-.18+flap*.65);c.fillStyle=d.wing;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(7,-47,37,-53);c.quadraticCurveTo(36,-21,9,12);c.closePath();c.fill();c.strokeStyle=d.accent;c.lineWidth=2*s;c.stroke();c.restore();const a=Math.sin(t*9)*.1,b=Math.sin(t*9+Math.PI)*.1;c.strokeStyle=d.body;c.lineWidth=8*s;c.save();c.translate(-13,13);c.rotate(.45+a);c.beginPath();c.moveTo(0,0);c.lineTo(-5,19);c.stroke();c.restore();c.save();c.translate(14,13);c.rotate(-.45+b);c.beginPath();c.moveTo(0,0);c.lineTo(6,19);c.stroke();c.restore();c.strokeStyle=d.body;c.lineWidth=11*s;c.lineCap="round";c.beginPath();c.moveTo(-26,3);c.quadraticCurveTo(-52,7,-65,Math.sin(t*5)*3+7);c.quadraticCurveTo(-75,10,-84,4);c.stroke();if(d.exclusive){c.globalAlpha=.35+.12*Math.sin(t*5);c.strokeStyle=d.accent;c.lineWidth=4*s;c.beginPath();c.arc(0,-8,62*s,0,Math.PI*2);c.stroke()}c.restore()}
function startGame(){ $("game").classList.add("active");$("menu").classList.remove("active");$("gameOver").classList.remove("show");playing=true;score=0;runCoins=0;vel=0;dragonY=H*.45;pipes=[];coinsOnMap=[];last=performance.now();$("score").textContent=0;$("gameCoins").textContent=0;for(let i=0;i<4;i++)addPipe(W+260+i*210);requestAnimationFrame(loop)}function addPipe(x){const gap=170,top=70+Math.random()*(H-70-gap-130);pipes.push({x,top,gap,passed:false});if(Math.random()<.8)coinsOnMap.push({x:x+55,y:top+gap/2,taken:false})}function flap(){if(playing&&!$("gameOver").classList.contains("show"))vel=-520}addEventListener("pointerdown",e=>{if(e.target.tagName!=="BUTTON"&&playing)flap()});
function loop(now){if(!playing)return;const dt=Math.min(.032,(now-last)/1000);last=now;t+=dt;vel+=1450*dt;dragonY+=vel*dt;const speed=250+Math.min(score*4,180);for(const p of pipes)p.x-=speed*dt;for(const c of coinsOnMap)c.x-=speed*dt;while(pipes.length&&pipes[0].x<-100)pipes.shift();while(coinsOnMap.length&&coinsOnMap[0].x<-30)coinsOnMap.shift();if(pipes.length&&pipes[pipes.length-1].x<W-180)addPipe(W+80);for(const p of pipes)if(!p.passed&&p.x+70<110){p.passed=true;score++;runCoins+=2}for(const c of coinsOnMap)if(!c.taken&&Math.hypot(c.x-110,c.y-dragonY)<38){c.taken=true;runCoins++}draw();const hit=dragonY<35||dragonY>H-35||pipes.some(p=>145>p.x&&75<p.x+70&&(dragonY-20<p.top||dragonY+20>p.top+p.gap));if(hit)return endGame();$("score").textContent=score;$("gameCoins").textContent=runCoins;requestAnimationFrame(loop)}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#17234f");g.addColorStop(1,"#0a1026");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.22;for(let i=0;i<20;i++){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc((i*137+t*10)%W,50+(i*73)%H,1.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const p of pipes){ctx.fillStyle="#4e9a63";ctx.fillRect(p.x,0,70,p.top);ctx.fillRect(p.x,p.top+p.gap,70,H);ctx.fillStyle="#72bf7e";ctx.fillRect(p.x-6,p.top-10,82,10);ctx.fillRect(p.x-6,p.top+p.gap,82,10)}for(const c of coinsOnMap)if(!c.taken){ctx.fillStyle="#ffd447";ctx.beginPath();ctx.arc(c.x,c.y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff1a0";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText("1",c.x,c.y+4)}drawDragon(ctx,110,dragonY,.9,Math.max(-.45,Math.min(.75,vel/900)))}function endGame(){playing=false;data.best=Math.max(data.best,score);data.coins+=runCoins;save();$("finalScore").textContent=score;$("finalCoins").textContent=runCoins;$("gameOver").classList.add("show")}function back(){playing=false;$("game").classList.remove("active");$("menu").classList.add("active")}$("play").onclick=startGame;$("again").onclick=startGame;$("backMenu").onclick=back;$("shop").onclick=showCollection;$("customize").onclick=showCollection;$("sound").onclick=()=>{data.sound=!data.sound;$("sound").textContent=data.sound?"🔊 SOUND":"🔇 SOUND";save()};$("reset").onclick=()=>{if(confirm("Reset all progress?")){localStorage.removeItem(key);location.reload()}};function showCollection(){renderDragons();$("collection").classList.add("show")}function closePanels(){$("collection").classList.remove("show")}
function renderDragons(){const grid=$("dragonGrid");grid.innerHTML="";for(const d of dragons){const owned=data.owned.includes(d.id)||d.id==="ember";const card=document.createElement("div");card.className="card"+(!owned?" locked":"");card.innerHTML=`<div class="preview"><canvas width="280" height="130"></canvas></div><h3>${d.name}${d.exclusive?" 👑":""}</h3><p>${d.desc}</p><button class="${owned?'':'buy'}">${d.exclusive?'EXCLUSIVE':owned?(data.selected===d.id?'SELECTED':'SELECT'):`🪙 ${d.price.toLocaleString()} COINS`}</button>`;const pc=card.querySelector("canvas"),pctx=pc.getContext("2d"),old=data.selected;data.selected=d.id;drawDragon(pctx,140,78,.75,0);data.selected=old;card.querySelector("button").onclick=()=>{if(d.exclusive)return alert("This dragon is exclusive.");if(data.owned.includes(d.id)){data.selected=d.id;save();renderDragons();return}if(data.coins>=d.price){if(confirm(`Are you sure you want to buy ${d.name}?`)){data.coins-=d.price;data.owned.push(d.id);data.selected=d.id;save();renderDragons()}}else alert("Not enough coins.")};grid.appendChild(card)}}
</script></body></html>
