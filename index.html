<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dragon Tap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #9ec9ef; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui {
    position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #3a2a4a;
    pointer-events: none;
  }
  #ui.hidden { display: none; }
  h1 { font-size: 36px; font-weight: 800; letter-spacing: .02em; }
  p { margin: 10px 0 0; font-size: 16px; opacity: .85; }
  #score {
    position: fixed; top: 16px; left: 0; right: 0; z-index: 3; text-align: center;
    font-size: 44px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 0 #5a3d78, 0 4px 12px rgba(0,0,0,.25);
    pointer-events: none;
  }
  #hi-box {
    position: fixed; top: 14px; left: 14px; z-index: 4;
    background: rgba(58, 36, 88, .78); color: #fff;
    border-radius: 14px; padding: 8px 14px 9px;
    min-width: 86px; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  #hi-box .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; font-weight: 700; }
  #hi-box .val { font-size: 26px; font-weight: 800; line-height: 1.1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hi-box"><div class="lbl">Best</div><div class="val" id="hi-val">0</div></div>
<div id="score">0</div>
<div id="ui">
  <h1>Dragon Tap</h1>
  <p id="msg">Tap anywhere to fly</p>
</div>
<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const ui = document.getElementById("ui");
  const msg = document.getElementById("msg");
  const scoreEl = document.getElementById("score");
  const hiEl = document.getElementById("hi-val");
  const HI = "dragon-tap-hi";

  let W = 0, H = 0, dpr = 1, groundY = 0;
  let state = "ready";
  let last = 0;
  let bird, pipes, parts;
  let score = 0, hi = Number(localStorage.getItem(HI) || 0);
  hiEl.textContent = String(hi);
  let wing = 0, scroll = 0;
  const GAP = 190, PW = 70, SPEED0 = 200, GRAV = 1600, FLAP = -460;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = H - 90;
    if (bird) {
      bird.x = W * 0.3;
      bird.y = Math.min(bird.y, groundY - 20);
    }
  }
  window.addEventListener("resize", size);
  size();

  function reset() {
    bird = { x: W * 0.3, y: H * 0.42, vy: 0, rot: 0, pal: pickPal() };
    pipes = [];
    parts = [];
    extras = [];
    score = 0; scroll = 0; wing = 0;
    scoreEl.textContent = "0";
    pipes.push(makePipe(W + 80));
    pipes.push(makePipe(W + 80 + Math.max(220, W * 0.45)));
    for (let i = 0; i < 3; i++) {
      extras.push({
        x: W * (0.55 + i * 0.28),
        y: 70 + (i * 97) % (H * 0.45),
        s: 0.42 + i * 0.08,
        pal: pickPal(bird.pal),
        flap: Math.random(),
        rot: -0.15,
        vx: 18 + i * 10
      });
    }
  }

  function makePipe(x) {
    const min = 80, max = Math.max(min + 10, groundY - GAP - 80);
    const top = min + Math.random() * (max - min);
    return { x, top, passed: false };
  }

  function flap(e) {
    if (e) e.preventDefault();
    if (state === "ready" || state === "dead") {
      reset();
      state = "play";
      ui.classList.add("hidden");
    }
    if (state === "play") {
      bird.vy = FLAP;
      wing = 1;
    }
  }

  function die() {
    if (state !== "play") return;
    state = "dead";
    hi = Math.max(hi, score);
    localStorage.setItem(HI, String(hi));
    hiEl.textContent = String(hi);
    ui.classList.remove("hidden");
    msg.textContent = "Ouch. " + score + "  ·  best " + hi + ". Tap again.";
    for (let i = 0; i < 16; i++) {
      parts.push({
        x: bird.x, y: bird.y,
        vx: (Math.random() - 0.5) * 240,
        vy: (Math.random() - 0.7) * 240,
        life: 0.5, c: ["#ffd4e5", "#c9b6ff", "#fff1a8"][i % 3]
      });
    }
  }

  function sky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#7ebbe8");
    g.addColorStop(1, "#f4cfe0");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    const x = ((scroll * 0.2) % (W + 180)) - 90;
    ctx.beginPath(); ctx.ellipse(x, 80, 50, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 160, 130, 40, 14, 0, 0, Math.PI * 2); ctx.fill();
  }

  function ground() {
    ctx.fillStyle = "#6bb86a";
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = "#8fd48a";
    ctx.fillRect(0, groundY, W, 12);
    ctx.fillStyle = "#e0b56a";
    ctx.fillRect(0, groundY + 12, W, H);
  }

  function drawPipes() {
    for (const p of pipes) {
      ctx.fillStyle = "#6d52f2";
      ctx.fillRect(p.x, 0, PW, p.top);
      ctx.fillRect(p.x, p.top + GAP, PW, groundY - (p.top + GAP));
      ctx.fillStyle = "#9b84ff";
      ctx.fillRect(p.x - 6, p.top - 24, PW + 12, 24);
      ctx.fillRect(p.x - 6, p.top + GAP, PW + 12, 24);
    }
  }


  const PALS = [
    { body:"#2a2c33", belly:"#3d414c", wing:"#1c1e24", horn:"#3a3d46", eye:"#b6e04a", pupil:"#14200a", glow:"#7dffb0", blush:"#5a3a44", tongue:"#e07a8a", tooth:"#f4f1ea", spot:"#5ee0c8" },
    { body:"#4aa3e8", belly:"#d8eefc", wing:"#2d7fc4", horn:"#f2c56b", eye:"#ff8a3d", pupil:"#3a1408", glow:"#ffe08a", blush:"#ff9aa8", tongue:"#ff6b86", tooth:"#fff", spot:"#fff3b0" },
    { body:"#8b6cff", belly:"#e4dcff", wing:"#6a48d4", horn:"#c9b6ff", eye:"#ffe36b", pupil:"#2a2208", glow:"#d4b8ff", blush:"#ff9ec4", tongue:"#ff7a9c", tooth:"#fff", spot:"#b8f0ff" },
    { body:"#f2c7a4", belly:"#fff4e6", wing:"#e0a57a", horn:"#c98b5c", eye:"#2eb8c9", pupil:"#062428", glow:"#9cf0e0", blush:"#f4a0a8", tongue:"#ee7a86", tooth:"#fff", spot:"#ffd6e8" },
    { body:"#3faf7a", belly:"#d4f3e0", wing:"#2d8a5c", horn:"#f0d56a", eye:"#ffb347", pupil:"#2a1806", glow:"#b8ff9a", blush:"#ef8fa0", tongue:"#e56b7c", tooth:"#fff", spot:"#fff1a0" },
    { body:"#f07878", belly:"#ffe4dc", wing:"#d45a5a", horn:"#ffd18a", eye:"#7dffd2", pupil:"#083028", glow:"#ffd36e", blush:"#ffb0c0", tongue:"#e85a78", tooth:"#fff", spot:"#ffe9a8" }
  ];

  let extras = [];

  function pickPal(avoid) {
    const pool = PALS.filter(p => p !== avoid);
    return pool[(Math.random() * pool.length) | 0];
  }

  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  function drawChibi(pal, flapAmt) {
    const f = Math.sin(flapAmt * Math.PI) * 8;
    // back wing
    ctx.fillStyle = pal.wing;
    ctx.beginPath();
    ctx.moveTo(-2, 0);
    ctx.quadraticCurveTo(-8, -18 - f, 10, -16 - f);
    ctx.quadraticCurveTo(8, -4, 0, 4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.glow;
    ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-2, -12 - f, 7, -13); ctx.stroke();
    ctx.globalAlpha = 1;

    // tail, spade tip (not the fan from the reference)
    ctx.strokeStyle = pal.body;
    ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-12, 8); ctx.quadraticCurveTo(-28, 6, -36, 16); ctx.stroke();
    ctx.fillStyle = pal.body;
    ctx.beginPath();
    ctx.moveTo(-34, 14);
    ctx.lineTo(-46, 10);
    ctx.lineTo(-42, 20);
    ctx.lineTo(-34, 18);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.glow;
    ctx.globalAlpha = 0.7;
    ellipse(-40, 15, 1.6, 1.6); ctx.fill();
    ctx.globalAlpha = 1;

    // tiny feet tucked
    ctx.fillStyle = pal.body;
    ellipse(-5, 14.5, 3.6, 2.8, 0.25); ctx.fill();
    ellipse(5, 15, 3.8, 2.9, -0.2); ctx.fill();

    // plump body
    ctx.fillStyle = pal.body;
    ellipse(0, 6.5, 13.5, 12); ctx.fill();
    ctx.fillStyle = pal.belly;
    ellipse(1.5, 9.5, 8.2, 7.2); ctx.fill();
    // glowing back spots (not on the reference)
    ctx.fillStyle = pal.spot;
    ctx.globalAlpha = 0.85;
    ellipse(-6, 2, 1.7, 1.5); ctx.fill();
    ellipse(-1, 0.5, 1.3, 1.2); ctx.fill();
    ellipse(5, 3, 1.1, 1); ctx.fill();
    ctx.globalAlpha = 1;

    // front wing
    ctx.fillStyle = pal.wing;
    ctx.beginPath();
    ctx.moveTo(2, 2);
    ctx.quadraticCurveTo(6, -22 - f, 22, -10 - f * 0.6);
    ctx.quadraticCurveTo(10, 2, 2, 6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.glow;
    ctx.globalAlpha = 0.22;
    ctx.beginPath();
    ctx.moveTo(4, 2);
    ctx.quadraticCurveTo(8, -14 - f, 16, -8);
    ctx.quadraticCurveTo(8, 2, 4, 5);
    ctx.fill();
    ctx.globalAlpha = 1;

    // curled pointed horns (reference had round nubs)
    ctx.fillStyle = pal.horn;
    ctx.beginPath();
    ctx.moveTo(8, -12);
    ctx.quadraticCurveTo(6, -24, 12, -22);
    ctx.quadraticCurveTo(12, -16, 11, -12);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(16, -13);
    ctx.quadraticCurveTo(18, -26, 23, -22);
    ctx.quadraticCurveTo(20, -16, 18, -12);
    ctx.closePath(); ctx.fill();

    // ears
    ctx.fillStyle = pal.body;
    ellipse(7.5, -10, 3.4, 4.2, -0.5); ctx.fill();
    ellipse(18, -11, 3.2, 4, 0.35); ctx.fill();
    ctx.fillStyle = pal.blush;
    ellipse(7.6, -10, 1.5, 2.1, -0.5); ctx.fill();
    ellipse(17.8, -11, 1.4, 2, 0.35); ctx.fill();

    // big round head
    ctx.fillStyle = pal.body;
    ellipse(13, -1.5, 13.2, 12.2, 0.06); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.08)";
    ellipse(8, -5, 5, 3.5, -0.4); ctx.fill();

    // snout
    ctx.fillStyle = pal.body;
    ellipse(22, 4, 7.4, 5.6, 0.12); ctx.fill();

    // teeth + blep
    ctx.fillStyle = pal.tooth;
    ctx.beginPath(); ctx.moveTo(20.5, 5.2); ctx.lineTo(21.6, 7.4); ctx.lineTo(22.7, 5.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(23.2, 5.4); ctx.lineTo(24.2, 7.2); ctx.lineTo(25.3, 5.4); ctx.fill();
    ctx.fillStyle = pal.tongue;
    ellipse(26.2, 7.4, 2.4, 1.7, 0.25); ctx.fill();

    // almond eyes, vertical pupils, extra lash to differ
    ctx.fillStyle = "#f7f4ea";
    ellipse(16.2, -2.2, 4.3, 5.0, -0.12); ctx.fill();
    ctx.fillStyle = pal.eye;
    ellipse(16.6, -2.0, 2.8, 3.5, -0.12); ctx.fill();
    ctx.fillStyle = pal.pupil;
    ellipse(16.8, -1.9, 0.85, 2.5, -0.12); ctx.fill();
    ctx.fillStyle = "#fff";
    ellipse(17.8, -3.4, 1.1, 1.3); ctx.fill();
    ellipse(15.6, -1.0, 0.5, 0.55); ctx.fill();
    ctx.strokeStyle = pal.body;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(16.2, -2.4, 4.4, Math.PI * 1.05, Math.PI * 1.82); ctx.stroke();

    // blush
    ctx.fillStyle = pal.blush;
    ctx.globalAlpha = 0.55;
    ellipse(11.5, 3.4, 3.2, 1.8); ctx.fill();
    ctx.globalAlpha = 1;

    // smile line
    ctx.strokeStyle = pal.blush;
    ctx.lineWidth = 1.2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(23.5, 4.6, 4.0, 0.15, 1.05); ctx.stroke();
  }

  function drawDragon() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.scale(0.78, 0.78);
    drawChibi(bird.pal, wing);
    ctx.restore();
  }

  function drawExtras() {
    for (const e of extras) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.rot);
      ctx.globalAlpha = 0.92;
      ctx.scale(e.s, e.s);
      drawChibi(e.pal, e.flap);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function tick(ts) {
    const dt = Math.min(0.033, last ? (ts - last) / 1000 : 0.016);
    last = ts;
    if (wing > 0) wing = Math.max(0, wing - dt * 3);
    if (!bird) reset();

    if (state === "play") {
      bird.vy += GRAV * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.max(-0.5, Math.min(1, bird.vy / 700));
      scroll += SPEED0 * dt;
      const spd = SPEED0 + Math.min(140, score * 6);
      for (const p of pipes) {
        p.x -= spd * dt;
        if (!p.passed && p.x + PW < bird.x) {
          p.passed = true;
          score += 1;
          scoreEl.textContent = String(score);
        }
      }
      if (pipes[0] && pipes[0].x < -PW - 20) {
        pipes.shift();
        pipes.push(makePipe(pipes[pipes.length - 1].x + Math.max(220, W * 0.45)));
      }
      if (bird.y + 14 > groundY || bird.y < 12) die();
      for (const p of pipes) {
        if (bird.x + 14 > p.x && bird.x - 12 < p.x + PW) {
          if (bird.y - 12 < p.top || bird.y + 12 > p.top + GAP) die();
        }
      }
    } else if (state === "ready") {
      bird.y = H * 0.42 + Math.sin(ts / 280) * 10;
      bird.rot = 0;
      wing = 0.4 + Math.sin(ts / 160) * 0.4;
      scroll += 50 * dt;
    } else {
      bird.vy += GRAV * dt;
      bird.y = Math.min(groundY - 12, bird.y + bird.vy * dt);
      bird.rot = Math.min(1.2, bird.rot + dt * 2.5);
      scroll += 20 * dt;
    }

    for (const s of parts) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 420 * dt; s.life -= dt;
    }
    parts = parts.filter(s => s.life > 0);

    for (const e of extras) {
      e.x -= (state === "play" ? 40 : 16) * dt + e.vx * dt * 0.2;
      e.y += Math.sin((ts / 400) + e.s) * 12 * dt;
      e.flap = (e.flap + dt * 2) % 1;
      if (e.x < -80) {
        e.x = W + 60;
        e.y = 60 + Math.random() * (groundY - 140);
        e.pal = pickPal(bird.pal);
      }
    }
    sky();
    drawExtras();
    drawPipes();
    ground();
    drawDragon();
    for (const s of parts) {
      ctx.globalAlpha = Math.max(0, s.life * 2);
      ctx.fillStyle = s.c;
      ctx.fillRect(s.x, s.y, 4, 4);
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(tick);
  }

  reset();
  requestAnimationFrame(tick);

  const opts = { passive: false };
  window.addEventListener("pointerdown", flap, opts);
  window.addEventListener("touchstart", flap, opts);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.key === "ArrowUp" || e.key === "Enter") {
      e.preventDefault();
      flap();
    }
  });
})();
</script>
</body>
</html>
