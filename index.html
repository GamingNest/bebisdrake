<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<title>Baby Dragon — GamingNest</title>
<style>
:root{--bg:#060714;--panel:#0c1026e8;--panel2:#111736ee;--purple:#8c4dff;--blue:#31a7ff;--gold:#ffbf3f;--text:#fff;--muted:#aeb7d6;--danger:#ff5577}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,#273c9c44,transparent 38%),linear-gradient(#050611,#10122c 60%,#070817);z-index:-2}
body:after{content:"";position:fixed;inset:0;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:32px 32px;transform:perspective(500px) rotateX(58deg) scale(1.8) translateY(18%);transform-origin:center bottom;z-index:-1;opacity:.45}
button{font:inherit;color:#fff;border:0}
.hidden{display:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between}
.hud-card{background:#090c1bd9;border:1px solid #6f6fff44;box-shadow:0 8px 25px #0008,0 0 20px #754bff18;backdrop-filter:blur(12px);border-radius:14px;padding:7px 12px;min-width:75px}
.hud-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8f9bc4;font-weight:900}
.hud-val{font-size:26px;font-weight:950;line-height:1}
#score{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:50px;font-weight:950;text-shadow:0 3px #15133b,0 0 25px #7c52ff88}
.icon-btn{pointer-events:auto;width:42px;height:42px;border-radius:13px;background:#0b0e22dc;border:1px solid #7f62ff55;box-shadow:0 6px 20px #0007;font-size:19px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#02030ab0;backdrop-filter:blur(7px)}
.panel{width:min(430px,94vw);max-height:92vh;overflow:auto;padding:24px 18px 20px;border:1px solid #8b63ff55;border-radius:28px;background:linear-gradient(160deg,#111734f3,#070a17f5);box-shadow:0 30px 90px #000c,0 0 60px #6b44ff1c}
.brand{font-size:12px;letter-spacing:.26em;font-weight:950;color:#bfa8ff;margin-bottom:6px}
.logo-mark{font-size:44px;margin-bottom:3px;filter:drop-shadow(0 0 15px #6c4cff88)}
h1{font-size:45px;line-height:.95;margin:0;font-weight:950;letter-spacing:-.045em}
h1 span{color:#9c61ff}
.tag{color:#d4daf2;margin:12px 0 18px;font-size:13px}
.primary{width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,#8e4dff,#327dff);box-shadow:0 10px 35px #6d4aff55;font-weight:950;font-size:17px}
.secondary{width:100%;padding:12px;border-radius:14px;background:#151b3be8;border:1px solid #6472b944;margin-top:10px;font-weight:800}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.menu-grid button{padding:11px 5px;border-radius:13px;background:#111833;border:1px solid #5562a533;color:#dfe5ff;font-weight:850;font-size:11px}
.menu-grid button b{display:block;font-size:20px;margin-bottom:4px}
.screen{display:none}
.screen.active{display:block}
.section-title{font-size:21px;font-weight:950;margin:0 0 4px}
.section-sub{font-size:12px;color:#9da8ca;margin-bottom:14px}
.back{float:left;background:#121936;border:1px solid #5863a333;width:34px;height:34px;border-radius:10px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
.item{background:#0e1530;border:1px solid #5362a833;border-radius:16px;padding:10px;text-align:left;position:relative}
.item.selected{border-color:#9d65ff;box-shadow:0 0 20px #824dff22}
.item img{width:100%;aspect-ratio:1.35;border-radius:11px;object-fit:cover;background:#171b3b}
.item .name{font-weight:900;font-size:13px;margin-top:7px}
.item .meta{font-size:10px;color:#9fa9ca;margin-top:3px}
.item button{width:100%;margin-top:7px;padding:8px;border-radius:10px;background:#171f46;font-weight:850;font-size:11px}
.item button.buy{background:linear-gradient(135deg,#6d4cff,#3c8dff)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.swatch{height:62px;border-radius:15px;border:2px solid #ffffff14;position:relative}
.swatch.selected{border-color:#fff;box-shadow:0 0 18px #fff4}
.swatch span{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;text-shadow:0 1px 4px #000}
.map-grid{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}
.map{height:84px;border-radius:16px;border:1px solid #ffffff1c;padding:13px;text-align:left;display:flex;align-items:flex-end;background-size:cover;background-position:center}
.map.selected{outline:2px solid #9b63ff}
.map b{font-size:15px}.map small{display:block;color:#c8d0ea;font-size:10px;margin-top:2px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:10px 15px;border-radius:13px;background:#111832ee;border:1px solid #7c6cff55;opacity:0;pointer-events:none;transition:.2s;z-index:40;font-size:12px;font-weight:850;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:650px){.panel{padding:18px 16px}h1{font-size:37px}.menu-grid button{padding:8px}.item img{aspect-ratio:1.5}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="top">
    <div class="hud-card"><div class="hud-label">Best</div><div class="hud-val" id="best">0</div></div>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">Ⅱ</button>
  </div>
  <div id="score">0</div>
</div>

<div id="overlay">
  <div class="panel">
    <div id="home" class="screen active">
      <div class="logo-mark">🐉</div>
      <div class="brand">GAMINGNEST PRESENTS</div>
      <h1>BABY <span>DRAGON</span></h1>
      <div class="tag">A little dragon. A big adventure.</div>
      <button class="primary" id="playBtn">▶ PLAY</button>
      <div class="menu-grid">
        <button data-screen="dragons"><b>🐲</b>Dragons</button>
        <button data-screen="colors"><b>🎨</b>Colors</button>
        <button data-screen="maps"><b>🗺️</b>Maps</button>
        <button data-screen="shop"><b>🛒</b>Shop</button>
        <button id="soundMenu"><b>🔊</b>Sound</button>
        <button id="resetBtn"><b>↻</b>Reset</button>
      </div>
      <div class="tag" style="margin-top:14px;margin-bottom:0;font-size:10px;letter-spacing:.12em">SMALL GAMES · BIG ADVENTURES</div>
    </div>

    <div id="dragons" class="screen">
      <button class="back" data-home>‹</button><div class="section-title">Dragons</div><div class="section-sub">Choose your flying companion.</div>
      <div class="cards" id="dragonCards"></div>
    </div>

    <div id="colors" class="screen">
      <button class="back" data-home>‹</button><div class="section-title">Colors</div><div class="section-sub">Customize your dragon.</div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div id="maps" class="screen">
      <button class="back" data-home>‹</button><div class="section-title">Maps</div><div class="section-sub">Fly through different worlds.</div>
      <div class="map-grid" id="mapGrid"></div>
    </div>

    <div id="shop" class="screen">
      <button class="back" data-home>‹</button><div class="section-title">Dragon Shop</div><div class="section-sub">Earn coins by playing and unlock new dragons.</div>
      <div class="cards" id="shopCards"></div>
    </div>
  </div>
</div>
<div id="flash"></div><div id="toast"></div>

<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),toast=document.getElementById('toast');
let W=0,H=0,D=1,state='ready',last=0,score=0,best=+(localStorage.getItem('gn_best')||0),coins=+(localStorage.getItem('gn_coins')||0),muted=localStorage.getItem('gn_muted')==='1';
let dragon,obstacles,particles,scroll=0,wing=0,selectedDragon=localStorage.getItem('gn_dragon')||'baby',selectedColor=localStorage.getItem('gn_color')||'night',selectedMap=localStorage.getItem('gn_map')||'sky';
const owned=new Set(JSON.parse(localStorage.getItem('gn_owned')||'["baby"]'));
const dragons=[
{id:'baby',name:'Baby Dragon',price:0,body:'#2f4f92',wing:'#5ca8ff',eye:'#67c9ff'},
{id:'fire',name:'Fire Dragon',price:500,body:'#a63d2f',wing:'#ff7b32',eye:'#ffd36a'},
{id:'ice',name:'Ice Dragon',price:800,body:'#6bc7e8',wing:'#b7f4ff',eye:'#fff'},
{id:'forest',name:'Forest Dragon',price:1200,body:'#397b55',wing:'#83cf67',eye:'#d9ff8a'},
{id:'shadow',name:'Shadow Dragon',price:1500,body:'#5c3a8d',wing:'#a16cff',eye:'#e6c5ff'},
{id:'gold',name:'Golden Dragon',price:2000,body:'#c28a27',wing:'#ffd55a',eye:'#fff1a0'}
];
const colors=[
{id:'night',name:'Night',body:'#2f4f92',wing:'#5ca8ff'},
{id:'rose',name:'Rose',body:'#d45d91',wing:'#ff9ec4'},
{id:'mint',name:'Mint',body:'#3e9c82',wing:'#8df1c8'},
{id:'sun',name:'Sunset',body:'#c66a28',wing:'#ffcf66'},
{id:'violet',name:'Violet',body:'#6540a5',wing:'#b28cff'},
{id:'lava',name:'Lava',body:'#a83b32',wing:'#ff744e'},
{id:'frost',name:'Frost',body:'#579fc1',wing:'#c4f5ff'},
{id:'gold',name:'Gold',body:'#ba8629',wing:'#ffe072'}
];
const maps=[
{id:'sky',name:'Sky Kingdom',desc:'Bright skies & floating islands',a:'#78bfff',b:'#f5d3e6'},
{id:'night',name:'Neon Night',desc:'City lights & purple clouds',a:'#0a0c3a',b:'#6a2a9a'},
{id:'sunset',name:'Dragon Sunset',desc:'Warm mountains & golden skies',a:'#ef754e',b:'#542d74'},
{id:'ice',name:'Frozen Peaks',desc:'Cold air & crystal mountains',a:'#a9e7ff',b:'#6d7de0'}
];
function save(){localStorage.setItem('gn_best',best);localStorage.setItem('gn_coins',coins);localStorage.setItem('gn_owned',JSON.stringify([...owned]));localStorage.setItem('gn_dragon',selectedDragon);localStorage.setItem('gn_color',selectedColor);localStorage.setItem('gn_map',selectedMap);localStorage.setItem('gn_muted',muted?'1':'0')}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
let AC=null;
function beep(freq=600,dur=.06,type='sine',gain=.035){if(muted)return;try{AC??=new(window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.stop(AC.currentTime+dur)}catch{}}
function vibrate(v){try{navigator.vibrate?.(v)}catch{}}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1400)}
function resetGame(){dragon={x:W*.28,y:H*.42,vy:0,rot:0};obstacles=[makeObstacle(W+100),makeObstacle(W+100+Math.max(250,W*.48))];particles=[];score=0;scroll=0;wing=.5;scoreEl.textContent='0'}
function makeObstacle(px){let ground=H-84,min=68,max=Math.max(min+10,ground-190-70);return{x:px,top:min+Math.random()*(max-min),passed:false}}
function currentDragon(){return dragons.find(d=>d.id===selectedDragon)||dragons[0]}
function currentColor(){return colors.find(c=>c.id===selectedColor)||colors[0]}
function flap(){if(state==='ready'||state==='dead'){resetGame();state='play';overlay.classList.add('hidden');beep(760,.07,'triangle');vibrate(8)}else if(state==='play'&&!paused){dragon.vy=-470;wing=1;beep(860,.045,'triangle');vibrate(6)}}
function die(){if(state!=='play')return;state='dead';best=Math.max(best,score);coins+=score*5;save();bestEl.textContent=best;document.getElementById('home').querySelector('.tag').textContent=`Score ${score} · ${coins} coins`;overlay.classList.remove('hidden');showScreen('home');beep(130,.2,'sawtooth',.06);vibrate([30,40,80]);document.getElementById('playBtn').textContent='▶ PLAY AGAIN';for(let i=0;i<24;i++)particles.push({x:dragon.x,y:dragon.y,vx:(Math.random()-.5)*280,vy:(Math.random()-.6)*280,life:.7,col:i%2?'#9e63ff':'#ffd15b'})}
function bg(){let m=maps.find(q=>q.id===selectedMap)||maps[0],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,m.a);g.addColorStop(1,m.b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff18';for(let i=0;i<45;i++){let sx=(i*151-scroll*.12)%(W+30);if(sx<0)sx+=W+30,;let sy=(i*71)%(H-110);ctx.fillRect(sx,sy,2,2)}if(selectedMap==='night'){ctx.fillStyle='#ffffff12';for(let i=0;i<10;i++){let bx=(i*95-scroll*.35)%W;ctx.fillRect(bx,H-170-(i%4)*28,45,86)}}else{ctx.fillStyle='#ffffff2b';for(let i=0;i<3;i++){let cx=((i*260+scroll*.05)%(W+260))-130;ctx.beginPath();ctx.ellipse(cx,90+i*80,75,20,0,0,Math.PI*2);ctx.fill()}}}
function ground(){let gy=H-84;ctx.fillStyle='#080b19';ctx.fillRect(0,gy,W,84);ctx.fillStyle='#8c4dff';ctx.fillRect(0,gy,W,4);ctx.fillStyle='#ffffff10';for(let i=0;i<30;i++){let xx=(i*80-scroll*.7)%W;if(xx<0)xx+=W;ctx.fillRect(xx,gy+18+(i%3)*16,34,2)}}
function obstaclesDraw(){let gy=H-84;for(const p of obstacles){let gr=ctx.createLinearGradient(p.x,0,p.x+74,0);gr.addColorStop(0,'#4a22a0');gr.addColorStop(.5,'#a35cff');gr.addColorStop(1,'#4c1e94');ctx.fillStyle=gr;ctx.fillRect(p.x,0,74,p.top);ctx.fillRect(p.x,p.top+190,74,gy-(p.top+190));ctx.fillStyle='#d19aff';ctx.fillRect(p.x-7,p.top-20,88,20);ctx.fillRect(p.x-7,p.top+190,88,20)}}
function dragonDraw(){let b=dragon,d=currentDragon(),co=currentColor(),body=co.body,wingC=co.wing,f=Math.sin(wing*Math.PI)*10;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.shadowBlur=18;ctx.shadowColor=wingC;ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,6,23,17,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffe1c2';ctx.beginPath();ctx.ellipse(2,11,13,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=wingC;ctx.beginPath();ctx.moveTo(0,1);ctx.quadraticCurveTo(5,-32-f,28,-7-f*.4);ctx.quadraticCurveTo(9,4,0,7);ctx.fill();ctx.fillStyle=wingC;ctx.beginPath();ctx.moveTo(-16,8);ctx.quadraticCurveTo(-34,6,-42,18);ctx.lineWidth=8;ctx.strokeStyle=wingC;ctx.lineCap='round';ctx.stroke();ctx.fillStyle='#ffd36e';ctx.beginPath();ctx.moveTo(-42,18);ctx.lineTo(-52,12);ctx.lineTo(-44,26);ctx.fill();ctx.fillStyle='#c9b6ff';ctx.beginPath();ctx.moveTo(12,-12);ctx.lineTo(10,-27);ctx.lineTo(19,-12);ctx.fill();ctx.beginPath();ctx.moveTo(22,-14);ctx.lineTo(25,-29);ctx.lineTo(29,-11);ctx.fill();ctx.fillStyle=d.eye||'#67c9ff';ctx.beginPath();ctx.ellipse(24,-4,5,5.4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#15142a';ctx.beginPath();ctx.arc(25,-4,2.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(26,-5.2,1,0,Math.PI*2);ctx.fill();ctx.restore()}
let paused=false;
function tick(ts){let dt=Math.min(.033,last?(ts-last)/1000:.016);last=ts;if(wing>0)wing=Math.max(0,wing-dt*3);if(state==='play'&&!paused){dragon.vy+=1550*dt;dragon.y+=dragon.vy*dt;dragon.rot=Math.max(-.5,Math.min(1,dragon.vy/700));scroll+=200*dt;let spd=200+Math.min(160,score*6);for(const p of obstacles){p.x-=spd*dt;if(!p.passed&&p.x+74<dragon.x){p.passed=true;score++;coins+=2;scoreEl.textContent=score;beep(980,.04);vibrate(5)}}if(obstacles[0].x<-110){obstacles.shift();obstacles.push(makeObstacle(obstacles.at(-1).x+Math.max(250,W*.48)))}let gy=H-84;if(dragon.y+16>gy||dragon.y<12)die();for(const p of obstacles)if(dragon.x+18>p.x&&dragon.x-16<p.x+74&&(dragon.y-14<p.top||dragon.y+14>p.top+190))die()}else if(state==='ready'){dragon.y=H*.42+Math.sin(ts/280)*10;dragon.rot=0;wing=.4+Math.sin(ts/160)*.4;scroll+=35*dt}else if(state==='dead'){dragon.vy+=1550*dt;dragon.y=Math.min(H-96,dragon.y+dragon.vy*dt);dragon.rot=Math.min(1.2,dragon.rot+dt*2.5);scroll+=15*dt}for(const s of particles){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=420*dt;s.life-=dt}particles=particles.filter(s=>s.life>0);bg();obstaclesDraw();ground();dragonDraw();for(const s of particles){ctx.globalAlpha=Math.max(0,s.life*1.7);ctx.fillStyle=s.col;ctx.fillRect(s.x,s.y,5,5);ctx.globalAlpha=1}requestAnimationFrame(tick)}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));overlay.classList.remove('hidden')}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{showScreen(b.dataset.screen);renderLists()});
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>showScreen('home'));
document.getElementById('playBtn').onclick=()=>flap();
document.getElementById('pauseBtn').onclick=()=>{if(state==='play'){paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶':'Ⅱ';showToast(paused?'Paused':'Resumed')}};
document.getElementById('soundMenu').onclick=()=>{muted=!muted;save();document.getElementById('soundMenu').innerHTML=`<b>${muted?'🔇':'🔊'}</b>Sound`;showToast(muted?'Sound off':'Sound on')};
document.getElementById('resetBtn').onclick=()=>{localStorage.clear();location.reload()};
addEventListener('pointerdown',e=>{if(overlay.classList.contains('hidden')&&!e.target.closest('button'))flap()},{passive:false});
addEventListener('keydown',e=>{if(['Space','ArrowUp','Enter'].includes(e.code)){e.preventDefault();flap()}});
function dragonCard(d,shop=false){let ownedNow=owned.has(d.id),sel=selectedDragon===d.id;return `<div class="item ${sel?'selected':''}"><div style="height:100px;border-radius:11px;background:radial-gradient(circle at 50% 40%,${d.wing}55,transparent 55%),linear-gradient(135deg,#101a40,#080b19);display:flex;align-items:center;justify-content:center;font-size:58px">🐉</div><div class="name">${d.name}</div><div class="meta">${ownedNow?'Owned':d.price+' coins'}</div><button data-dragon="${d.id}" class="${ownedNow?'':'buy'}">${ownedNow?(sel?'Selected':'Select'):'Unlock'}</button></div>`}
function renderLists(){document.getElementById('dragonCards').innerHTML=dragons.map(d=>dragonCard(d)).join('');document.getElementById('shopCards').innerHTML=dragons.filter(d=>d.price>0).map(d=>dragonCard(d,true)).join('');document.getElementById('swatches').innerHTML=colors.map(c=>`<button class="swatch ${selectedColor===c.id?'selected':''}" data-color="${c.id}" style="background:linear-gradient(135deg,${c.body},${c.wing})"><span>${c.name}</span></button>`).join('');document.getElementById('mapGrid').innerHTML=maps.map(m=>`<button class="map ${selectedMap===m.id?'selected':''}" data-map="${m.id}" style="background-image:linear-gradient(90deg,#0008,#0002),linear-gradient(135deg,${m.a},${m.b})"><div><b>${m.name}</b><small>${m.desc}</small></div></button>`).join('')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-dragon]');if(b){let id=b.dataset.dragon,d=dragons.find(q=>q.id===id);if(!owned.has(id)){if(coins<d.price){showToast('Not enough coins');return}coins-=d.price;owned.add(id);showToast('Dragon unlocked!');beep(920,.1,'triangle')}selectedDragon=id;save();renderLists();return}b=e.target.closest('[data-color]');if(b){selectedColor=b.dataset.color;save();renderLists();showToast('Color selected');return}b=e.target.closest('[data-map]');if(b){selectedMap=b.dataset.map;save();renderLists();showToast('Map selected');return}});
bestEl.textContent=best;renderLists();resetGame();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
