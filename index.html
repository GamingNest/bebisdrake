<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070616">
<title>Baby Dragon — GamingNest</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070616;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:#fff}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:52px;font-weight:900;text-shadow:0 3px 8px #000,0 0 25px #8b55ff}
.hudbox{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;padding:6px 12px;border-radius:12px;background:#080a1ddd;border:1px solid #9060ff55;text-align:center}
.hudbox small{display:block;color:#aeb7d5;font-size:9px;font-weight:900;letter-spacing:.12em}
.hudbox b{font-size:23px}
#pause{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));width:44px;height:44px;border-radius:13px;border:1px solid #9060ff55;background:#080a1ddd;color:#fff;font-size:19px;pointer-events:auto}
#screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:#02030bc7;backdrop-filter:blur(6px)}
#screen.hidden{display:none}
.panel{width:min(430px,94vw);padding:25px 18px 20px;border-radius:27px;border:1px solid #9365ff66;background:linear-gradient(160deg,#111736f7,#070a18f8);box-shadow:0 30px 90px #000d;text-align:center}
.logo{font-size:58px;filter:drop-shadow(0 0 18px #8050ff);margin-bottom:2px}
.brand{font-size:11px;font-weight:950;letter-spacing:.28em;color:#bfa8ff}
h1{margin:3px 0 0;font-size:43px;line-height:.95;letter-spacing:-.05em}
h1 span{color:#9d61ff}
.tag{margin:12px 0 18px;color:#cbd3eb;font-size:13px;line-height:1.45}
.play{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#8b4dff,#357fff);font-weight:950;font-size:18px;box-shadow:0 10px 30px #7148ff55}
.hint{margin-top:12px;color:#929ec2;font-size:11px}
#tapHint{position:fixed;z-index:10;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 14px;border-radius:12px;background:#080a1dcc;border:1px solid #8f63ff44;font-size:11px;font-weight:900;pointer-events:none;opacity:0;transition:.2s}
#tapHint.show{opacity:1}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="hudbox"><small>BEST</small><b id="best">0</b></div>
 <div id="score">0</div>
 <button id="pause" type="button">Ⅱ</button>
</div>
<div id="screen">
 <div class="panel">
  <div class="logo">🐉</div>
  <div class="brand">GAMINGNEST PRESENTS</div>
  <h1>BABY <span>DRAGON</span></h1>
  <div class="tag" id="status">A little dragon. A big adventure.<br><b>Flappy Edition</b></div>
  <button class="play" id="play" type="button">▶ PLAY</button>
  <div class="hint">Tap the screen to flap • Avoid the purple gates</div>
 </div>
</div>
<div id="tapHint">TAP TO FLY</div>

<script>
(function(){
"use strict";

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var screen=document.getElementById("screen");
var play=document.getElementById("play");
var pause=document.getElementById("pause");
var scoreText=document.getElementById("score");
var bestText=document.getElementById("best");
var statusText=document.getElementById("status");
var tapHint=document.getElementById("tapHint");

var W=0,H=0,dpr=1;
var mode="menu";
var paused=false;
var score=0;
var best=Number(localStorage.getItem("babyDragonBest")||0);
var lastTime=0;
var lastInput=0;
var dragon={x:0,y:0,vy:0};
var gates=[];
var scroll=0;
var wing=0;

bestText.textContent=String(best);

function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth; H=window.innerHeight;
 canvas.width=Math.floor(W*dpr);
 canvas.height=Math.floor(H*dpr);
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function makeGate(x){
 var gap=190;
 var topMin=60;
 var bottom=H-85-gap;
 var top=topMin+Math.random()*Math.max(10,bottom-topMin);
 return {x:x,top:top,gap:gap,passed:false};
}

function newGame(){
 score=0;
 scroll=0;
 wing=0;
 dragon.x=W*0.28;
 dragon.y=H*0.42;
 dragon.vy=0;
 gates=[makeGate(W+100),makeGate(W+100+Math.max(280,W*0.55))];
 scoreText.textContent="0";
}

function begin(){
 newGame();
 mode="playing";
 paused=false;
 pause.textContent="Ⅱ";
 screen.classList.add("hidden");
 tapHint.classList.add("show");
 setTimeout(function(){tapHint.classList.remove("show");},1400);
 flap();
}

function flap(){
 if(mode==="menu"){begin();return;}
 if(mode==="dead"){begin();return;}
 if(mode==="playing" && !paused){
  dragon.vy=-455;
  wing=1;
 }
}

function endGame(){
 if(mode!=="playing")return;
 mode="dead";
 if(score>best){
  best=score;
  localStorage.setItem("babyDragonBest",String(best));
  bestText.textContent=String(best);
 }
 statusText.innerHTML="Score <b>"+score+"</b> · Best <b>"+best+"</b><br><b>GamingNest</b> · Flappy Edition";
 play.textContent="▶ PLAY AGAIN";
 screen.classList.remove("hidden");
}

function drawBackground(){
 var g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#5d7fe0");
 g.addColorStop(.55,"#9e79cf");
 g.addColorStop(1,"#e9a4b2");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.fillStyle="rgba(255,255,255,.18)";
 for(var i=0;i<18;i++){
  var x=((i*177-scroll*.08)%(W+160))-80;
  var y=70+(i*91)%(Math.max(1,H-190));
  ctx.beginPath();
  ctx.ellipse(x,y,48,14,0,0,Math.PI*2);
  ctx.fill();
 }
}

function drawGround(){
 var y=H-85;
 ctx.fillStyle="#080a18";
 ctx.fillRect(0,y,W,85);
 ctx.fillStyle="#9c5cff";
 ctx.fillRect(0,y,W,4);
}

function drawGates(){
 var ground=H-85;
 for(var i=0;i<gates.length;i++){
  var p=gates[i];
  var gr=ctx.createLinearGradient(p.x,0,p.x+76,0);
  gr.addColorStop(0,"#43209a");
  gr.addColorStop(.5,"#a65cff");
  gr.addColorStop(1,"#4a2096");
  ctx.fillStyle=gr;
  ctx.fillRect(p.x,0,76,p.top);
  ctx.fillRect(p.x,p.top+p.gap,76,ground-(p.top+p.gap));
  ctx.fillStyle="#d6a2ff";
  ctx.fillRect(p.x-7,p.top-20,90,20);
  ctx.fillRect(p.x-7,p.top+p.gap,90,20);
 }
}

function drawDragon(){
 var x=dragon.x,y=dragon.y;
 var body="#273e78", wingColor="#ff914d";
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(Math.max(-.5,Math.min(1,dragon.vy/700)));

 ctx.shadowBlur=18;
 ctx.shadowColor=wingColor;
 ctx.fillStyle=wingColor;
 ctx.beginPath();
 ctx.moveTo(-2,3);
 ctx.quadraticCurveTo(3,-34-wing*7,28,-8);
 ctx.quadraticCurveTo(12,4,-2,8);
 ctx.fill();
 ctx.shadowBlur=0;

 ctx.fillStyle=body;
 ctx.beginPath();
 ctx.ellipse(0,7,24,18,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#ffe1c2";
 ctx.beginPath();
 ctx.ellipse(3,12,13,9,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle=body;
 ctx.beginPath();
 ctx.ellipse(21,-2,17,14,.05,0,Math.PI*2);
 ctx.fill();
 ctx.beginPath();
 ctx.ellipse(32,3,10,7,.05,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#b9c9ff";
 ctx.beginPath();
 ctx.moveTo(9,-10);ctx.lineTo(7,-29);ctx.lineTo(17,-14);ctx.closePath();ctx.fill();
 ctx.beginPath();
 ctx.moveTo(20,-11);ctx.lineTo(24,-30);ctx.lineTo(29,-9);ctx.closePath();ctx.fill();

 ctx.fillStyle="#ffd36a";
 ctx.beginPath();
 ctx.ellipse(26,-4,5.5,5.8,0,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#151426";
 ctx.beginPath();
 ctx.arc(27,-4,2.5,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#fff";
 ctx.beginPath();
 ctx.arc(28,-5.2,1.1,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle=body;
 ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(-14,9);
 ctx.quadraticCurveTo(-34,10,-48,21);
 ctx.stroke();

 ctx.restore();
}

function update(dt){
 if(mode!=="playing" || paused)return;

 dragon.vy+=1450*dt;
 dragon.y+=dragon.vy*dt;
 scroll+=210*dt;
 wing=Math.max(0,wing-dt*3);

 var speed=205+Math.min(140,score*5);
 for(var i=0;i<gates.length;i++){
  var p=gates[i];
  p.x-=speed*dt;
  if(!p.passed && p.x+76<dragon.x){
   p.passed=true;
   score++;
   scoreText.textContent=String(score);
  }
 }

 if(gates[0].x<-100){
  gates.shift();
  gates.push(makeGate(gates[gates.length-1].x+Math.max(280,W*.55)));
 }

 var ground=H-85;
 if(dragon.y-15<0 || dragon.y+15>ground){endGame();return;}

 for(var j=0;j<gates.length;j++){
  var q=gates[j];
  var hitX=dragon.x+17>q.x && dragon.x-17<q.x+76;
  var hitY=dragon.y-14<q.top || dragon.y+14>q.top+q.gap;
  if(hitX && hitY){endGame();return;}
 }
}

function draw(){
 drawBackground();
 drawGates();
 drawGround();
 drawDragon();
}

function loop(t){
 var dt=Math.min(.035,lastTime?(t-lastTime)/1000:.016);
 lastTime=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

function safeInput(){
 var now=Date.now();
 if(now-lastInput<120)return;
 lastInput=now;
 flap();
}

play.addEventListener("click",function(e){
 e.preventDefault();
 e.stopPropagation();
 begin();
});

canvas.addEventListener("pointerdown",function(e){
 e.preventDefault();
 safeInput();
},{passive:false});

canvas.addEventListener("touchstart",function(e){
 e.preventDefault();
 safeInput();
},{passive:false});

canvas.addEventListener("mousedown",function(e){
 e.preventDefault();
 safeInput();
});

pause.addEventListener("click",function(e){
 e.preventDefault();
 e.stopPropagation();
 if(mode==="playing"){
  paused=!paused;
  pause.textContent=paused?"▶":"Ⅱ";
  tapHint.textContent=paused?"PAUSED":"TAP TO FLY";
  tapHint.classList.add("show");
  setTimeout(function(){tapHint.classList.remove("show");},900);
 }
});

window.addEventListener("keydown",function(e){
 if(e.code==="Space"||e.code==="ArrowUp"){
  e.preventDefault();
  safeInput();
 }
});

newGame();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
