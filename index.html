<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070616">
<title>Baby Dragon — GamingNest</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070616;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:#fff;border:0}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:max(7px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:50px;font-weight:950;text-shadow:0 3px 8px #000,0 0 25px #8b55ff}
.hudbox{position:absolute;top:max(11px,env(safe-area-inset-top));left:11px;padding:6px 12px;border-radius:13px;background:#080a1ddd;border:1px solid #9060ff55;text-align:center}
.hudbox small{display:block;color:#aeb7d5;font-size:9px;font-weight:900;letter-spacing:.12em}.hudbox b{font-size:23px}
#coinsHud{position:absolute;top:max(11px,env(safe-area-inset-top));right:65px;padding:7px 10px;border-radius:13px;background:#080a1ddd;border:1px solid #ffca5555;font-size:14px;font-weight:900}
#pause{position:absolute;right:11px;top:max(11px,env(safe-area-inset-top));width:44px;height:44px;border-radius:13px;border:1px solid #9060ff55;background:#080a1ddd;pointer-events:auto}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:17px;background:#02030bcc;backdrop-filter:blur(6px)}
#overlay.hidden{display:none}.panel{width:min(430px,94vw);max-height:92vh;overflow:auto;padding:23px 17px 19px;border-radius:27px;border:1px solid #9365ff66;background:linear-gradient(160deg,#111736f7,#070a18f8);box-shadow:0 30px 90px #000d}
.logo{text-align:center;font-size:54px;filter:drop-shadow(0 0 18px #8050ff)}.brand{text-align:center;font-size:10px;letter-spacing:.28em;color:#bfa8ff;font-weight:950}
h1{text-align:center;margin:4px 0 0;font-size:42px;line-height:.95;letter-spacing:-.05em}h1 span{color:#9d61ff}
.tag{text-align:center;color:#cbd3eb;font-size:12px;line-height:1.45;margin:10px 0 15px}
.primary{width:100%;padding:15px;border-radius:15px;background:linear-gradient(135deg,#8b4dff,#357fff);font-weight:950;font-size:17px;box-shadow:0 10px 30px #7148ff55}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.menu button{padding:10px 3px;border-radius:12px;background:#111832;border:1px solid #5e6eb044;font-size:10px;font-weight:850}.menu i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
.screen{display:none}.screen.active{display:block}.back{float:left;width:34px;height:34px;border-radius:10px;background:#121936;border:1px solid #5e6eb044;font-size:22px}.title{text-align:center;font-weight:950;font-size:21px}.sub{text-align:center;color:#aab3d2;font-size:10px;margin:3px 0 10px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.card{background:#0d1530;border:1px solid #5363a044;border-radius:14px;padding:7px;text-align:center}.card.selected{border-color:#a56cff;box-shadow:0 0 18px #884cff22}
.thumb{height:83px;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}.dragon-art{font-size:49px;filter:drop-shadow(0 0 10px #fff5)}
.card b{display:block;font-size:11px;margin-top:5px}.card small{display:block;color:#9da8ca;margin-top:2px;font-size:9px}.card button{width:100%;margin-top:6px;padding:7px;border-radius:9px;background:#182043;font-size:10px;font-weight:900}.card button.buy{background:linear-gradient(135deg,#6f4cff,#3b8cff)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatch{height:55px;border-radius:13px;border:2px solid #ffffff18;position:relative}.swatch.selected{border-color:#fff;box-shadow:0 0 15px #fff4}.swatch span{position:absolute;bottom:3px;left:0;right:0;font-size:8px;font-weight:950;text-shadow:0 1px 4px #000}
.map{width:100%;height:65px;margin:4px 0;border-radius:13px;text-align:left;padding:9px 12px;border:1px solid #ffffff22}.map.selected{border-color:#a56cff}.map b{display:block;font-size:12px}.map small{color:#c6cee5;font-size:9px}
#toast{position:fixed;z-index:40;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,12px);opacity:0;transition:.2s;background:#111832ee;border:1px solid #7d6cff55;padding:9px 13px;border-radius:12px;font-size:11px;font-weight:900;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="hudbox"><small>BEST</small><b id="best">0</b></div><div id="score">0</div><div id="coinsHud">🪙 <span id="coins">0</span></div><button id="pause" type="button">Ⅱ</button></div>

<div id="overlay"><div class="panel">
<section id="home" class="screen active">
<div class="logo">🐉</div><div class="brand">GAMINGNEST PRESENTS</div><h1>BABY <span>DRAGON</span></h1>
<div class="tag" id="status">A little dragon. A big adventure.<br><b>Flappy Edition</b></div>
<button class="primary" id="play" type="button">▶ PLAY</button>
<div class="menu">
<button data-screen="dragons"><i>🐲</i>Dragons</button><button data-screen="colors"><i>🎨</i>Colors</button><button data-screen="maps"><i>🗺️</i>Maps</button>
<button data-screen="shop"><i>🛒</i>Shop</button><button id="sound"><i>🔊</i>Sound</button><button id="reset"><i>↻</i>Reset</button>
</div>
<div class="tag" style="font-size:9px;letter-spacing:.12em;margin-bottom:0">SMALL GAMES · BIG ADVENTURES</div>
</section>
<section id="dragons" class="screen"><button class="back" data-home>‹</button><div class="title">Dragons</div><div class="sub">Unique designs with different silhouettes.</div><div id="dragonCards" class="cards"></div></section>
<section id="shop" class="screen"><button class="back" data-home>‹</button><div class="title">Dragon Shop</div><div class="sub">Coins earned from successful flights.</div><div id="shopCards" class="cards"></div></section>
<section id="colors" class="screen"><button class="back" data-home>‹</button><div class="title">Colors</div><div class="sub">Eight distinct color palettes.</div><div id="swatches" class="swatches"></div></section>
<section id="maps" class="screen"><button class="back" data-home>‹</button><div class="title">Maps</div><div class="sub">Change the atmosphere.</div><div id="mapsList"></div></section>
</div></div><div id="toast"></div>

<script>
(function(){
"use strict";
var canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),overlay=document.getElementById("overlay");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),coinsEl=document.getElementById("coins"),play=document.getElementById("play"),pause=document.getElementById("pause");
var W=0,H=0,dpr=1,mode="menu",paused=false,last=0,score=0,scroll=0,wing=0,lastTap=0;
var best=Number(localStorage.getItem("gn_best")||0),coins=Number(localStorage.getItem("gn_coins")||0),muted=localStorage.getItem("gn_muted")==="1";
var selectedDragon=localStorage.getItem("gn_dragon")||"baby",selectedColor=localStorage.getItem("gn_color")||"ocean",selectedMap=localStorage.getItem("gn_map")||"sky";
var owned;try{owned=new Set(JSON.parse(localStorage.getItem("gn_owned")||'["baby"]'));}catch(e){owned=new Set(["baby"]);}

var dragons=[
{id:"baby",name:"Baby Dragon",price:0,body:"#263b70",wing:"#ff914d",eye:"#ffd36a",accent:"#b9c9ff",style:"baby"},
{id:"fire",name:"Fire Dragon",price:500,body:"#8d211b",wing:"#ff5b24",eye:"#ffe36b",accent:"#ffbd32",style:"fire"},
{id:"ice",name:"Ice Dragon",price:800,body:"#4c9fc1",wing:"#d9fbff",eye:"#69eaff",accent:"#fff",style:"ice"},
{id:"forest",name:"Forest Dragon",price:1200,body:"#2c6b43",wing:"#82cf57",eye:"#d9ff73",accent:"#b9df8b",style:"forest"},
{id:"shadow",name:"Shadow Dragon",price:1500,body:"#30213f",wing:"#9d4cff",eye:"#e5b7ff",accent:"#d080ff",style:"shadow"},
{id:"gold",name:"Golden Dragon",price:2000,body:"#956018",wing:"#ffd24a",eye:"#fff0a0",accent:"#fff2ae",style:"gold"}];
var colors=[
{id:"ocean",name:"Ocean",body:"#176aa5",wing:"#4fd5ff"},{id:"ember",name:"Ember",body:"#a82d1f",wing:"#ff7b32"},
{id:"amethyst",name:"Amethyst",body:"#6330a6",wing:"#c16cff"},{id:"emerald",name:"Emerald",body:"#1d7a51",wing:"#6ee77c"},
{id:"sunrise",name:"Sunrise",body:"#c66a22",wing:"#ffd25a"},{id:"frost",name:"Frost",body:"#75b9d5",wing:"#d8fbff"},
{id:"midnight",name:"Midnight",body:"#20263a",wing:"#65738f"},{id:"royal",name:"Royal",body:"#5b3a9d",wing:"#f08cff"}];
var maps=[
{id:"sky",name:"Sky Kingdom",desc:"Bright skies & floating islands",a:"#78bfff",b:"#f5d3e6"},
{id:"night",name:"Neon Night",desc:"Purple clouds & city lights",a:"#0a0c3a",b:"#6a2a9a"},
{id:"sunset",name:"Dragon Sunset",desc:"Warm mountains & golden skies",a:"#ef754e",b:"#542d74"},
{id:"ice",name:"Frozen Peaks",desc:"Cold air & crystal mountains",a:"#a9e7ff",b:"#6d7de0"}];
var dragon={x:0,y:0,vy:0,rot:0},gates=[];

function save(){localStorage.setItem("gn_best",best);localStorage.setItem("gn_coins",coins);localStorage.setItem("gn_owned",JSON.stringify(Array.from(owned)));localStorage.setItem("gn_dragon",selectedDragon);localStorage.setItem("gn_color",selectedColor);localStorage.setItem("gn_map",selectedMap);localStorage.setItem("gn_muted",muted?"1":"0");coinsEl.textContent=String(coins);}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener("resize",resize);resize();

function getDragon(){for(var i=0;i<dragons.length;i++)if(dragons[i].id===selectedDragon)return dragons[i];return dragons[0]}
function getColor(){for(var i=0;i<colors.length;i++)if(colors[i].id===selectedColor)return colors[i];return colors[0]}
function getMap(){for(var i=0;i<maps.length;i++)if(maps[i].id===selectedMap)return maps[i];return maps[0]}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){el.className=""},1200)}
function makeGate(x){var gap=190,ground=H-85,min=60,max=Math.max(min+5,ground-gap-65);return{x:x,top:min+Math.random()*(max-min),gap:gap,passed:false}}
function resetGame(){score=0;scroll=0;wing=0;dragon={x:W*.28,y:H*.42,vy:0,rot:0};gates=[makeGate(W+100),makeGate(W+100+Math.max(280,W*.55))];scoreEl.textContent="0"}
function start(){resetGame();mode="playing";paused=false;pause.textContent="Ⅱ";overlay.classList.add("hidden");flap(true)}
function flap(force){if(!force&&Date.now()-lastTap<110)return;lastTap=Date.now();if(mode==="menu"||mode==="dead"){start();return}if(mode==="playing"&&!paused){dragon.vy=-455;wing=1}}
function die(){if(mode!=="playing")return;mode="dead";if(score>best)best=score;coins+=score*5;save();bestEl.textContent=String(best);document.getElementById("status").innerHTML="Score <b>"+score+"</b> · Best <b>"+best+"</b><br>🪙 <b>"+coins+"</b> coins · GamingNest";play.textContent="▶ PLAY AGAIN";overlay.classList.remove("hidden");show("home")}

function drawBG(){var m=getMap(),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,m.a);g.addColorStop(1,m.b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff3";for(var i=0;i<22;i++){var x=((i*173-scroll*.08)%(W+160))-80,y=55+(i*79)%(Math.max(1,H-170));ctx.beginPath();ctx.ellipse(x,y,45,13,0,0,Math.PI*2);ctx.fill()}}
function drawGround(){var y=H-85;ctx.fillStyle="#080a18";ctx.fillRect(0,y,W,85);ctx.fillStyle="#9c5cff";ctx.fillRect(0,y,W,4)}
function drawGates(){var ground=H-85;for(var i=0;i<gates.length;i++){var p=gates[i],g=ctx.createLinearGradient(p.x,0,p.x+76,0);g.addColorStop(0,"#43209a");g.addColorStop(.5,"#a65cff");g.addColorStop(1,"#4a2096");ctx.fillStyle=g;ctx.fillRect(p.x,0,76,p.top);ctx.fillRect(p.x,p.top+p.gap,76,ground-p.top-p.gap);ctx.fillStyle="#d6a2ff";ctx.fillRect(p.x-7,p.top-20,90,20);ctx.fillRect(p.x-7,p.top+p.gap,90,20)}}
function drawDragon(){var d=getDragon(),c=getColor(),style=d.style,b=dragon,x=b.x,y=b.y;ctx.save();ctx.translate(x,y);ctx.rotate(Math.max(-.5,Math.min(1,b.vy/700)));ctx.lineJoin="round";ctx.shadowBlur=16;ctx.shadowColor=c.wing;ctx.fillStyle=c.wing;ctx.beginPath();if(style==="fire"){ctx.moveTo(-1,3);ctx.lineTo(3,-35-wing*7);ctx.lineTo(16,-23);ctx.lineTo(30,-31);ctx.lineTo(24,-5)}else if(style==="ice"){ctx.moveTo(-1,3);ctx.lineTo(0,-38-wing*7);ctx.lineTo(13,-25);ctx.lineTo(27,-37);ctx.lineTo(24,-5)}else if(style==="forest"){ctx.moveTo(-1,3);ctx.quadraticCurveTo(-2,-32-wing*7,8,-24);ctx.lineTo(17,-35);ctx.lineTo(24,-7)}else if(style==="shadow"){ctx.moveTo(-1,3);ctx.lineTo(-9,-34-wing*7);ctx.lineTo(6,-24);ctx.lineTo(18,-39);ctx.lineTo(29,-7)}else if(style==="gold"){ctx.moveTo(-1,3);ctx.lineTo(5,-35-wing*7);ctx.lineTo(17,-23);ctx.lineTo(28,-31);ctx.lineTo(24,-5)}else{ctx.moveTo(-1,3);ctx.quadraticCurveTo(2,-34-wing*7,28,-9);ctx.quadraticCurveTo(10,4,-1,8)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=c.body;ctx.beginPath();ctx.ellipse(0,7,24,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=style==="ice"?"#d9f9ff":style==="fire"?"#ffad55":style==="forest"?"#b3d98c":style==="shadow"?"#8c6aa9":style==="gold"?"#ffe59b":"#ffe1c2";ctx.beginPath();ctx.ellipse(3,12,13,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=c.body;ctx.beginPath();ctx.ellipse(21,-2,17,14,.05,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(32,3,10,7,.05,0,Math.PI*2);ctx.fill();ctx.fillStyle=d.accent;ctx.beginPath();ctx.moveTo(9,-10);ctx.lineTo(6,-31);ctx.lineTo(16,-15);ctx.lineTo(23,-35);ctx.lineTo(29,-9);ctx.fill();ctx.fillStyle=d.eye;ctx.beginPath();ctx.ellipse(26,-4,5.5,5.8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#151426";ctx.beginPath();ctx.arc(27,-4,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(28,-5.2,1.1,0,Math.PI*2);ctx.fill();ctx.strokeStyle=c.body;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-14,9);ctx.quadraticCurveTo(-34,10,-48,21);ctx.stroke();ctx.restore()}
function update(dt){if(mode!=="playing"||paused)return;dragon.vy+=1450*dt;dragon.y+=dragon.vy*dt;scroll+=210*dt;wing=Math.max(0,wing-dt*3);var speed=205+Math.min(140,score*5);for(var i=0;i<gates.length;i++){var p=gates[i];p.x-=speed*dt;if(!p.passed&&p.x+76<dragon.x){p.passed=true;score++;coins+=2;coinsEl.textContent=String(coins);scoreEl.textContent=String(score);save()}}if(gates[0].x<-100){gates.shift();gates.push(makeGate(gates[gates.length-1].x+Math.max(280,W*.55)))}var ground=H-85;if(dragon.y-15<0||dragon.y+15>ground){die();return}for(var j=0;j<gates.length;j++){var q=gates[j];if(dragon.x+17>q.x&&dragon.x-17<q.x+76&&(dragon.y-14<q.top||dragon.y+14>q.top+q.gap)){die();return}}}
function loop(t){var dt=Math.min(.035,last?(t-last)/1000:.016);last=t;update(dt);drawBG();drawGates();drawGround();drawDragon();requestAnimationFrame(loop)}

function show(id){var ss=document.querySelectorAll(".screen");for(var i=0;i<ss.length;i++)ss[i].classList.toggle("active",ss[i].id===id)}
function render(){var dc="",sc="",sw="",ml="";for(var i=0;i<dragons.length;i++){var d=dragons[i],o=owned.has(d.id),s=selectedDragon===d.id;dc+='<div class="card '+(s?"selected":"")+'"><div class="thumb" style="background:linear-gradient(135deg,'+d.body+','+d.wing+')"><div class="dragon-art">🐉</div></div><b>'+d.name+'</b><small>'+(o?"Owned":d.price+" coins")+'</small><button data-dragon="'+d.id+'" class="'+(o?"":"buy")+'">'+(o?(s?"Selected":"Select"):"Unlock")+'</button></div>'}for(var j=1;j<dragons.length;j++){var q=dragons[j],oo=owned.has(q.id);sc+='<div class="card"><div class="thumb" style="background:linear-gradient(135deg,'+q.body+','+q.wing+')"><div class="dragon-art">🐉</div></div><b>'+q.name+'</b><small>'+q.price+' coins</small><button data-dragon="'+q.id+'" class="'+(oo?"":"buy")+'">'+(oo?"Select":"Unlock")+'</button></div>'}for(var k=0;k<colors.length;k++){var c=colors[k];sw+='<button class="swatch '+(selectedColor===c.id?"selected":"")+'" data-color="'+c.id+'" style="background:linear-gradient(135deg,'+c.body+','+c.wing+')"><span>'+c.name+'</span></button>'}for(var n=0;n<maps.length;n++){var m=maps[n];ml+='<button class="map '+(selectedMap===m.id?"selected":"")+'" data-map="'+m.id+'" style="background:linear-gradient(135deg,'+m.a+','+m.b+')"><b>'+m.name+'</b><small>'+m.desc+'</small></button>'}document.getElementById("dragonCards").innerHTML=dc;document.getElementById("shopCards").innerHTML=sc;document.getElementById("swatches").innerHTML=sw;document.getElementById("mapsList").innerHTML=ml}

document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;if(t.hasAttribute("data-screen")){show(t.getAttribute("data-screen"));render();return}if(t.hasAttribute("data-home")){show("home");return}if(t.hasAttribute("data-dragon")){var id=t.getAttribute("data-dragon"),d=null;for(var i=0;i<dragons.length;i++)if(dragons[i].id===id)d=dragons[i];if(!owned.has(id)){if(coins<d.price){toast("Not enough coins");return}coins-=d.price;owned.add(id);toast("Dragon unlocked!")}selectedDragon=id;save();render();return}if(t.hasAttribute("data-color")){selectedColor=t.getAttribute("data-color");save();render();toast("Color selected");return}if(t.hasAttribute("data-map")){selectedMap=t.getAttribute("data-map");save();render();toast("Map selected");return}});
play.addEventListener("click",function(){start()});
pause.addEventListener("click",function(){if(mode==="playing"){paused=!paused;pause.textContent=paused?"▶":"Ⅱ";toast(paused?"Paused":"Resumed")}});
document.getElementById("sound").addEventListener("click",function(){muted=!muted;save();this.innerHTML="<i>"+(muted?"🔇":"🔊")+"</i>Sound"});
document.getElementById("reset").addEventListener("click",function(){localStorage.clear();location.reload()});
canvas.addEventListener("pointerdown",function(e){e.preventDefault();flap(false)},{passive:false});
canvas.addEventListener("touchstart",function(e){e.preventDefault();flap(false)},{passive:false});
window.addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();flap(false)}});
bestText.textContent=String(best);coinsEl.textContent=String(coins);render();resetGame();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
