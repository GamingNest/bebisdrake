<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dragon Tap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #9ec9ef; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui {
    position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #3a2a4a;
    pointer-events: none;
  }
  #ui.hidden { display: none; }
  h1 { font-size: 36px; font-weight: 800; letter-spacing: .02em; }
  p { margin: 10px 0 0; font-size: 16px; opacity: .85; }
  #score {
    position: fixed; top: 16px; left: 0; right: 0; z-index: 3; text-align: center;
    font-size: 44px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 0 #5a3d78, 0 4px 12px rgba(0,0,0,.25);
    pointer-events: none;
  }
  #hi-box {
    position: fixed; top: 14px; left: 14px; z-index: 4;
    background: rgba(58, 36, 88, .78); color: #fff;
    border-radius: 14px; padding: 8px 14px 9px;
    min-width: 86px; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  #hi-box .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; font-weight: 700; }
  #hi-box .val { font-size: 26px; font-weight: 800; line-height: 1.1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hi-box"><div class="lbl">Best</div><div class="val" id="hi-val">0</div></div>
<div id="score">0</div>
<div id="ui">
  <h1>Dragon Tap</h1>
  <p id="msg">Tap anywhere to fly</p>
</div>
<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const ui = document.getElementById("ui");
  const msg = document.getElementById("msg");
  const scoreEl = document.getElementById("score");
  const hiEl = document.getElementById("hi-val");
  const HI = "dragon-tap-hi";

  let W = 0, H = 0, dpr = 1, groundY = 0;
  let state = "ready";
  let last = 0;
  let bird, pipes, parts;
  let score = 0, hi = Number(localStorage.getItem(HI) || 0);
  hiEl.textContent = String(hi);
  let wing = 0, scroll = 0;
  const GAP = 190, PW = 70, SPEED0 = 200, GRAV = 1600, FLAP = -460;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = H - 90;
    if (bird) {
      bird.x = W * 0.3;
      bird.y = Math.min(bird.y, groundY - 20);
    }
  }
  window.addEventListener("resize", size);
  size();

  function reset() {
    bird = { x: W * 0.3, y: H * 0.42, vy: 0, rot: 0 };
    pipes = [];
    parts = [];
    score = 0; scroll = 0; wing = 0;
    scoreEl.textContent = "0";
    pipes.push(makePipe(W + 80));
    pipes.push(makePipe(W + 80 + Math.max(220, W * 0.45)));
  }

  function makePipe(x) {
    const min = 80, max = Math.max(min + 10, groundY - GAP - 80);
    const top = min + Math.random() * (max - min);
    return { x, top, passed: false };
  }

  function flap(e) {
    if (e) e.preventDefault();
    if (state === "ready" || state === "dead") {
      reset();
      state = "play";
      ui.classList.add("hidden");
    }
    if (state === "play") {
      bird.vy = FLAP;
      wing = 1;
    }
  }

  function die() {
    if (state !== "play") return;
    state = "dead";
    hi = Math.max(hi, score);
    localStorage.setItem(HI, String(hi));
    hiEl.textContent = String(hi);
    ui.classList.remove("hidden");
    msg.textContent = "Ouch. " + score + "  ·  best " + hi + ". Tap again.";
    for (let i = 0; i < 16; i++) {
      parts.push({
        x: bird.x, y: bird.y,
        vx: (Math.random() - 0.5) * 240,
        vy: (Math.random() - 0.7) * 240,
        life: 0.5, c: ["#ffd4e5", "#c9b6ff", "#fff1a8"][i % 3]
      });
    }
  }

  function sky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#7ebbe8");
    g.addColorStop(1, "#f4cfe0");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    const x = ((scroll * 0.2) % (W + 180)) - 90;
    ctx.beginPath(); ctx.ellipse(x, 80, 50, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 160, 130, 40, 14, 0, 0, Math.PI * 2); ctx.fill();
  }

  function ground() {
    ctx.fillStyle = "#6bb86a";
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = "#8fd48a";
    ctx.fillRect(0, groundY, W, 12);
    ctx.fillStyle = "#e0b56a";
    ctx.fillRect(0, groundY + 12, W, H);
  }

  function drawPipes() {
    for (const p of pipes) {
      ctx.fillStyle = "#6d52f2";
      ctx.fillRect(p.x, 0, PW, p.top);
      ctx.fillRect(p.x, p.top + GAP, PW, groundY - (p.top + GAP));
      ctx.fillStyle = "#9b84ff";
      ctx.fillRect(p.x - 6, p.top - 24, PW + 12, 24);
      ctx.fillRect(p.x - 6, p.top + GAP, PW + 12, 24);
    }
  }

  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  function drawDragon() {
    const b = bird;
    const f = Math.sin(wing * Math.PI) * 7;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.scale(0.68, 0.68);

    // back wing
    ctx.fillStyle = "#e89abb";
    ctx.beginPath();
    ctx.moveTo(-2, 2);
    ctx.quadraticCurveTo(-2, -22 - f, 16, -10 - f * 0.5);
    ctx.quadraticCurveTo(6, 0, -2, 4);
    ctx.fill();
    ctx.strokeStyle = "rgba(180,80,120,.25)";
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, 1); ctx.quadraticCurveTo(2, -12 - f, 12, -8); ctx.stroke();

    // tail
    ctx.strokeStyle = "#f4a9c6";
    ctx.lineWidth = 6.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-12, 8); ctx.quadraticCurveTo(-26, 10, -32, 18); ctx.stroke();
    ctx.fillStyle = "#ffd56f";
    ctx.beginPath();
    ctx.moveTo(-31, 17);
    ctx.quadraticCurveTo(-40, 12, -38, 22);
    ctx.quadraticCurveTo(-32, 24, -31, 17);
    ctx.fill();
    ctx.fillStyle = "#ffe9a8";
    ellipse(-35, 18, 2.2, 1.6); ctx.fill();

    // little feet
    ctx.fillStyle = "#f09aba";
    ellipse(-6, 16, 4.2, 3.2, 0.2); ctx.fill();
    ellipse(6, 16.5, 4.4, 3.3, -0.15); ctx.fill();
    ctx.fillStyle = "#ffd36e";
    ellipse(-7.5, 17.4, 1.1, 0.9); ctx.fill();
    ellipse(-4.6, 17.6, 1.1, 0.9); ctx.fill();
    ellipse(4.6, 17.8, 1.1, 0.9); ctx.fill();
    ellipse(7.6, 17.6, 1.1, 0.9); ctx.fill();

    // chubby body
    ctx.fillStyle = "#ffb7d4";
    ellipse(0, 6, 16.5, 14.5); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ellipse(-4, 1, 7, 5, -0.4); ctx.fill();

    // belly
    ctx.fillStyle = "#fff1dc";
    ellipse(1, 10, 9.5, 8); ctx.fill();
    ctx.fillStyle = "#f3d3b0";
    ellipse(-3, 9, 1.5, 1.2); ctx.fill();
    ellipse(1.5, 11.5, 1.6, 1.3); ctx.fill();
    ellipse(5.5, 9.2, 1.4, 1.1); ctx.fill();

    // spots
    ctx.fillStyle = "rgba(232, 120, 160, .45)";
    ellipse(-8, 4, 2.2, 1.8); ctx.fill();
    ellipse(7, 8, 1.7, 1.4); ctx.fill();
    ellipse(-5, 12, 1.4, 1.1); ctx.fill();

    // front wing
    ctx.fillStyle = "#ff9fc8";
    ctx.beginPath();
    ctx.moveTo(2, 3);
    ctx.quadraticCurveTo(4, -24 - f, 20, -7 - f);
    ctx.quadraticCurveTo(8, 4, 2, 6);
    ctx.fill();
    ctx.fillStyle = "rgba(255,220,235,.55)";
    ctx.beginPath();
    ctx.moveTo(4, 3);
    ctx.quadraticCurveTo(6, -16 - f, 15, -6);
    ctx.quadraticCurveTo(8, 3, 4, 5);
    ctx.fill();

    // ears
    ctx.fillStyle = "#f4a3c4";
    ellipse(8, -12, 3.2, 4.2, -0.4); ctx.fill();
    ellipse(16, -13, 3, 4, 0.25); ctx.fill();
    ctx.fillStyle = "#ffd0e4";
    ellipse(8.2, -11.5, 1.6, 2.2, -0.4); ctx.fill();
    ellipse(15.8, -12.4, 1.5, 2.1, 0.25); ctx.fill();

    // horns, small and round
    ctx.fillStyle = "#d4c2ff";
    ellipse(10, -16.5, 2.1, 4.4, -0.15); ctx.fill();
    ellipse(17, -16.8, 2, 4.2, 0.2); ctx.fill();
    ctx.fillStyle = "#f0e9ff";
    ellipse(9.4, -17.5, 0.9, 1.8, -0.15); ctx.fill();
    ellipse(16.4, -17.8, 0.85, 1.7, 0.2); ctx.fill();

    // head, extra round
    ctx.fillStyle = "#ffb7d4";
    ellipse(14, -1, 12.5, 11.2, 0.08); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.3)";
    ellipse(10, -5, 5, 3.5, -0.3); ctx.fill();

    // snout
    ctx.fillStyle = "#ffcfe0";
    ellipse(24, 3.2, 7.2, 5.4, 0.12); ctx.fill();
    ctx.fillStyle = "#e889b0";
    ellipse(26.5, 2.2, 1.05, 0.8); ctx.fill();
    ellipse(29.2, 2.5, 1.05, 0.8); ctx.fill();

    // blush
    ctx.fillStyle = "rgba(255, 105, 145, .5)";
    ellipse(12, 3.2, 3.4, 2.1); ctx.fill();
    ellipse(22, 5, 2.6, 1.7); ctx.fill();

    // eye
    ctx.fillStyle = "#fff";
    ellipse(18.5, -2.6, 4.6, 5.1); ctx.fill();
    ctx.fillStyle = "#6b3d9a";
    ellipse(19.3, -2.4, 2.6, 3.1); ctx.fill();
    ctx.fillStyle = "#1e1230";
    ellipse(19.6, -2.2, 1.45, 1.8); ctx.fill();
    ctx.fillStyle = "#fff";
    ellipse(20.5, -3.5, 1.15, 1.3); ctx.fill();
    ellipse(18.6, -1.2, 0.55, 0.6); ctx.fill();
    ctx.strokeStyle = "#c56b95";
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(18.5, -2.8, 4.7, Math.PI * 1.05, Math.PI * 1.85); ctx.stroke();

    // smile
    ctx.strokeStyle = "#d56b94";
    ctx.lineWidth = 1.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(26, 4.2, 3.4, 0.15, 1.15); ctx.stroke();

    // tiny puff
    if (wing > 0.18) {
      ctx.fillStyle = "#ffe08a";
      ellipse(33, 3, 4.5, 2.6); ctx.fill();
      ctx.fillStyle = "#ff9a4a";
      ellipse(35.5, 3, 2.2, 1.4); ctx.fill();
    }

    ctx.restore();
  }

  function tick(ts) {
    const dt = Math.min(0.033, last ? (ts - last) / 1000 : 0.016);
    last = ts;
    if (wing > 0) wing = Math.max(0, wing - dt * 3);
    if (!bird) reset();

    if (state === "play") {
      bird.vy += GRAV * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.max(-0.5, Math.min(1, bird.vy / 700));
      scroll += SPEED0 * dt;
      const spd = SPEED0 + Math.min(140, score * 6);
      for (const p of pipes) {
        p.x -= spd * dt;
        if (!p.passed && p.x + PW < bird.x) {
          p.passed = true;
          score += 1;
          scoreEl.textContent = String(score);
        }
      }
      if (pipes[0] && pipes[0].x < -PW - 20) {
        pipes.shift();
        pipes.push(makePipe(pipes[pipes.length - 1].x + Math.max(220, W * 0.45)));
      }
      if (bird.y + 14 > groundY || bird.y < 12) die();
      for (const p of pipes) {
        if (bird.x + 14 > p.x && bird.x - 12 < p.x + PW) {
          if (bird.y - 12 < p.top || bird.y + 12 > p.top + GAP) die();
        }
      }
    } else if (state === "ready") {
      bird.y = H * 0.42 + Math.sin(ts / 280) * 10;
      bird.rot = 0;
      wing = 0.4 + Math.sin(ts / 160) * 0.4;
      scroll += 50 * dt;
    } else {
      bird.vy += GRAV * dt;
      bird.y = Math.min(groundY - 12, bird.y + bird.vy * dt);
      bird.rot = Math.min(1.2, bird.rot + dt * 2.5);
      scroll += 20 * dt;
    }

    for (const s of parts) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 420 * dt; s.life -= dt;
    }
    parts = parts.filter(s => s.life > 0);

    sky();
    drawPipes();
    ground();
    drawDragon();
    for (const s of parts) {
      ctx.globalAlpha = Math.max(0, s.life * 2);
      ctx.fillStyle = s.c;
      ctx.fillRect(s.x, s.y, 4, 4);
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(tick);
  }

  reset();
  requestAnimationFrame(tick);

  const opts = { passive: false };
  window.addEventListener("pointerdown", flap, opts);
  window.addEventListener("touchstart", flap, opts);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.key === "ArrowUp" || e.key === "Enter") {
      e.preventDefault();
      flap();
    }
  });
})();
</script>
</body>
</html>
