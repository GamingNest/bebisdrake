<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070616">
<title>Baby Dragon — GamingNest</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070616;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:#fff;border:0;cursor:pointer}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
.box{background:#080a19dd;border:1px solid #8b5cff55;border-radius:14px;padding:7px 12px;min-width:70px;text-align:center;box-shadow:0 8px 25px #0008}
.box small{display:block;color:#aab4d6;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.box b{font-size:24px;line-height:1}
#score{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:48px;font-weight:950;text-shadow:0 3px #14102d,0 0 24px #7b4cff88}
#pause{pointer-events:auto;width:42px;height:42px;border-radius:13px;background:#080a19dd;border:1px solid #8b5cff55}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px;background:#02030bcc;backdrop-filter:blur(6px)}
.panel{width:min(430px,94vw);max-height:92vh;overflow:auto;padding:25px 18px 20px;border:1px solid #8d64ff66;border-radius:26px;background:linear-gradient(160deg,#111734f5,#070a17f7);box-shadow:0 25px 80px #000c}
.hidden{display:none!important}
.brand{font-size:11px;letter-spacing:.28em;color:#bda5ff;font-weight:950;text-align:center}
.logo{font-size:55px;text-align:center;filter:drop-shadow(0 0 18px #8755ff)}
h1{margin:0;text-align:center;font-size:43px;line-height:.95;letter-spacing:-.04em;font-weight:950}
h1 span{color:#9d61ff}
.tag{text-align:center;color:#cbd2ea;font-size:13px;line-height:1.4;margin:12px 0 18px}
.primary{display:block;width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,#8c4dff,#347fff);box-shadow:0 10px 30px #6d4aff55;font-weight:950;font-size:17px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.menu button{padding:11px 4px;border-radius:13px;background:#111832;border:1px solid #5e6eb044;font-size:11px;font-weight:850}
.menu i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.screen{display:none}.screen.active{display:block}
.back{float:left;width:35px;height:35px;border-radius:10px;background:#121936;border:1px solid #5e6eb044;font-size:22px}
.title{text-align:center;font-weight:950;font-size:21px}
.sub{text-align:center;color:#aab3d2;font-size:11px;margin:4px 0 12px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:#0d1530;border:1px solid #5363a044;border-radius:15px;padding:8px;text-align:center}
.card.selected{border-color:#a56cff;box-shadow:0 0 20px #884cff22}
.thumb{width:100%;height:110px;border-radius:10px;display:block;background:#101735}
.card b{display:block;font-size:12px;margin-top:6px}
.card small{display:block;color:#9da8ca;margin-top:3px;font-size:10px}
.card button{width:100%;margin-top:7px;padding:8px;border-radius:10px;background:#182043;font-size:11px;font-weight:900}
.card button.buy{background:linear-gradient(135deg,#6f4cff,#3b8cff)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.swatch{height:58px;border-radius:14px;border:2px solid #ffffff18;position:relative}
.swatch.selected{border-color:#fff;box-shadow:0 0 16px #fff4}
.swatch span{position:absolute;bottom:4px;left:0;right:0;font-size:8px;font-weight:950;text-shadow:0 1px 4px #000}
.map{width:100%;height:70px;margin:5px 0;border-radius:14px;text-align:left;padding:10px 13px;background:linear-gradient(135deg,#28558d,#693a8f);border:1px solid #ffffff22}
.map.selected{border-color:#a56cff}
.map b{display:block}.map small{color:#c6cee5}
#toast{position:fixed;z-index:10;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;transition:.2s;background:#111832ee;border:1px solid #7d6cff55;padding:9px 14px;border-radius:12px;font-size:11px;font-weight:900;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="hud">
  <div class="box"><small>Best</small><b id="best">0</b></div>
  <div id="score">0</div>
  <button id="pause">Ⅱ</button>
</div></div>

<div id="overlay"><div class="panel">
<section id="home" class="screen active">
  <div class="logo">🐉</div><div class="brand">GAMINGNEST PRESENTS</div>
  <h1>BABY <span>DRAGON</span></h1>
  <div class="tag">A little dragon. A big adventure.<br><strong>Flappy Edition</strong> · 6 unique dragons</div>
  <button class="primary" id="play">▶ PLAY</button>
  <div class="menu">
    <button data-screen="dragons"><i>🐲</i>Dragons</button>
    <button data-screen="colors"><i>🎨</i>Colors</button>
    <button data-screen="maps"><i>🗺️</i>Maps</button>
    <button data-screen="shop"><i>🛒</i>Shop</button>
    <button id="sound"><i>🔊</i>Sound</button>
    <button id="reset"><i>↻</i>Reset</button>
  </div>
  <div class="tag" style="font-size:9px;letter-spacing:.12em;margin-bottom:0">SMALL GAMES · BIG ADVENTURES</div>
</section>

<section id="dragons" class="screen"><button class="back" data-home>‹</button><div class="title">Dragons</div><div class="sub">Six different dragon designs.</div><div id="dragonCards" class="cards"></div></section>
<section id="shop" class="screen"><button class="back" data-home>‹</button><div class="title">Dragon Shop</div><div class="sub">Earn coins by flying.</div><div id="shopCards" class="cards"></div></section>
<section id="colors" class="screen"><button class="back" data-home>‹</button><div class="title">Colors</div><div class="sub">Choose a non-duplicate color style.</div><div id="swatches" class="swatches"></div></section>
<section id="maps" class="screen"><button class="back" data-home>‹</button><div class="title">Maps</div><div class="sub">Change the atmosphere.</div><div id="mapsList"></div></section>
</div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var overlay=document.getElementById("overlay");
var scoreEl=document.getElementById("score");
var bestEl=document.getElementById("best");
var toast=document.getElementById("toast");
var pauseBtn=document.getElementById("pause");

var W=0,H=0,dpr=1;
var state="ready",paused=false,last=0,score=0,scroll=0,wing=0;
var best=parseInt(localStorage.getItem("gn_best")||"0",10);
var coins=parseInt(localStorage.getItem("gn_coins")||"0",10);
var muted=localStorage.getItem("gn_muted")==="1";
var selectedDragon=localStorage.getItem("gn_dragon")||"baby";
var selectedColor=localStorage.getItem("gn_color")||"ocean";
var selectedMap=localStorage.getItem("gn_map")||"sky";
var owned;
try{owned=new Set(JSON.parse(localStorage.getItem("gn_owned")||'["baby"]'));}catch(e){owned=new Set(["baby"]);}

var dragons=[
 {id:"baby",name:"Baby Dragon",price:0,body:"#263b70",wing:"#ff914d",eye:"#ffd36a",accent:"#b9c9ff",style:"baby"},
 {id:"fire",name:"Fire Dragon",price:500,body:"#8d211b",wing:"#ff5b24",eye:"#ffe36b",accent:"#ffbd32",style:"fire"},
 {id:"ice",name:"Ice Dragon",price:800,body:"#4c9fc1",wing:"#d9fbff",eye:"#69eaff",accent:"#ffffff",style:"ice"},
 {id:"forest",name:"Forest Dragon",price:1200,body:"#2c6b43",wing:"#82cf57",eye:"#d9ff73",accent:"#b9df8b",style:"forest"},
 {id:"shadow",name:"Shadow Dragon",price:1500,body:"#30213f",wing:"#9d4cff",eye:"#e5b7ff",accent:"#d080ff",style:"shadow"},
 {id:"gold",name:"Golden Dragon",price:2000,body:"#956018",wing:"#ffd24a",eye:"#fff0a0",accent:"#fff2ae",style:"gold"}
];

var colors=[
 {id:"ocean",name:"Ocean",body:"#176aa5",wing:"#4fd5ff"},
 {id:"ember",name:"Ember",body:"#a82d1f",wing:"#ff7b32"},
 {id:"amethyst",name:"Amethyst",body:"#6330a6",wing:"#c16cff"},
 {id:"emerald",name:"Emerald",body:"#1d7a51",wing:"#6ee77c"},
 {id:"sunrise",name:"Sunrise",body:"#c66a22",wing:"#ffd25a"},
 {id:"frost",name:"Frost",body:"#75b9d5",wing:"#d8fbff"},
 {id:"midnight",name:"Midnight",body:"#20263a",wing:"#65738f"},
 {id:"royal",name:"Royal",body:"#5b3a9d",wing:"#f08cff"}
];

var maps=[
 {id:"sky",name:"Sky Kingdom",desc:"Bright skies & floating islands",a:"#78bfff",b:"#f5d3e6"},
 {id:"night",name:"Neon Night",desc:"Purple clouds & city lights",a:"#0a0c3a",b:"#6a2a9a"},
 {id:"sunset",name:"Dragon Sunset",desc:"Warm mountains & golden skies",a:"#ef754e",b:"#542d74"},
 {id:"ice",name:"Frozen Peaks",desc:"Cold air & crystal mountains",a:"#a9e7ff",b:"#6d7de0"}
];

var dragon={x:0,y:0,vy:0,rot:0};
var pipes=[];

function save(){
 localStorage.setItem("gn_best",String(best));
 localStorage.setItem("gn_coins",String(coins));
 localStorage.setItem("gn_owned",JSON.stringify(Array.from(owned)));
 localStorage.setItem("gn_dragon",selectedDragon);
 localStorage.setItem("gn_color",selectedColor);
 localStorage.setItem("gn_map",selectedMap);
 localStorage.setItem("gn_muted",muted?"1":"0");
}
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth;H=window.innerHeight;
 canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function currentDragon(){for(var i=0;i<dragons.length;i++){if(dragons[i].id===selectedDragon)return dragons[i];}return dragons[0];}
function currentColor(){for(var i=0;i<colors.length;i++){if(colors[i].id===selectedColor)return colors[i];}return colors[0];}
function currentMap(){for(var i=0;i<maps.length;i++){if(maps[i].id===selectedMap)return maps[i];}return maps[0];}

var audio=null;
function beep(freq,dur){
 if(muted)return;
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  var o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=freq;o.type="sine";g.gain.value=.03;o.connect(g);g.connect(audio.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur);
 }catch(e){}
}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function showToast(t){toast.innerHTML=t;toast.className="show";clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){toast.className="";},1200);}

function resetGame(){
 dragon={x:W*.28,y:H*.42,vy:0,rot:0};
 pipes=[makePipe(W+120),makePipe(W+120+Math.max(270,W*.5))];
 score=0;scroll=0;wing=.5;scoreEl.textContent="0";
}
function makePipe(px){
 var ground=H-82,gap=190,min=65,max=Math.max(min+5,ground-gap-65);
 return {x:px,top:min+Math.random()*(max-min),passed:false};
}

function startGame(){
 resetGame();state="play";paused=false;pauseBtn.textContent="Ⅱ";overlay.className="hidden";beep(760,.07);buzz(8);
}
function flap(){
 if(state==="ready"||state==="dead"){startGame();return;}
 if(state==="play"&&!paused){dragon.vy=-470;wing=1;beep(850,.05);buzz(6);}
}
function die(){
 if(state!=="play")return;
 state="dead";
 if(score>best)best=score;
 coins+=score*5;save();
 bestEl.textContent=String(best);
 document.querySelector("#home .tag").innerHTML="Score <b>"+score+"</b> · "+coins+" coins<br><strong>Flappy Edition</strong> · 6 unique dragons";
 document.getElementById("play").textContent="▶ PLAY AGAIN";
 overlay.className="";
 showScreen("home");
 beep(120,.2);buzz(50);
}

function drawBackground(){
 var m=currentMap(),g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,m.a);g.addColorStop(1,m.b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="rgba(255,255,255,.22)";
 for(var i=0;i<35;i++){var sx=(i*151-scroll*.12)%(W+20);if(sx<0)sx+=W+20;var sy=(i*73)%(Math.max(1,H-100));ctx.fillRect(sx,sy,2,2);}
 ctx.fillStyle="rgba(255,255,255,.10)";
 for(var j=0;j<3;j++){var cx=((j*270+scroll*.04)%(W+260))-130;ctx.beginPath();ctx.ellipse(cx,90+j*75,80,20,0,0,Math.PI*2);ctx.fill();}
}
function drawGround(){
 var gy=H-82;ctx.fillStyle="#080b19";ctx.fillRect(0,gy,W,82);ctx.fillStyle="#8c4dff";ctx.fillRect(0,gy,W,4);
}
function drawPipes(){
 var gy=H-82;
 for(var i=0;i<pipes.length;i++){
  var p=pipes[i],gr=ctx.createLinearGradient(p.x,0,p.x+74,0);
  gr.addColorStop(0,"#4a22a0");gr.addColorStop(.5,"#a35cff");gr.addColorStop(1,"#4c1e94");ctx.fillStyle=gr;
  ctx.fillRect(p.x,0,74,p.top);ctx.fillRect(p.x,p.top+190,74,gy-(p.top+190));
  ctx.fillStyle="#d19aff";ctx.fillRect(p.x-7,p.top-20,88,20);ctx.fillRect(p.x-7,p.top+190,88,20);
 }
}

function drawDragon(){
 var b=dragon,d=currentDragon(),co=currentColor(),body=co.body,wingC=co.wing,style=d.style,f=Math.sin(wing*Math.PI)*9;
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.lineJoin="round";ctx.lineCap="round";
 ctx.strokeStyle=body;ctx.lineWidth=8;ctx.beginPath();
 if(style==="fire"){ctx.moveTo(-13,8);ctx.quadraticCurveTo(-38,16,-50,3);ctx.quadraticCurveTo(-57,-5,-52,-15);}
 else if(style==="ice"){ctx.moveTo(-13,8);ctx.quadraticCurveTo(-35,4,-48,18);ctx.quadraticCurveTo(-54,25,-61,17);}
 else if(style==="forest"){ctx.moveTo(-13,8);ctx.quadraticCurveTo(-33,10,-45,24);ctx.quadraticCurveTo(-52,31,-61,26);}
 else if(style==="shadow"){ctx.moveTo(-13,8);ctx.quadraticCurveTo(-36,19,-49,7);ctx.quadraticCurveTo(-57,-2,-51,-13);}
 else if(style==="gold"){ctx.moveTo(-13,8);ctx.quadraticCurveTo(-34,11,-46,19);ctx.quadraticCurveTo(-53,24,-59,14);}
 else {ctx.moveTo(-13,8);ctx.quadraticCurveTo(-34,10,-45,20);ctx.quadraticCurveTo(-52,26,-58,18);}
 ctx.stroke();

 ctx.shadowBlur=16;ctx.shadowColor=wingC;ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,6,24,18,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle=style==="ice"?"#d9f9ff":style==="fire"?"#ffad55":style==="forest"?"#b3d98c":style==="shadow"?"#8c6aa9":style==="gold"?"#ffe59b":"#ffe1c2";
 ctx.beginPath();ctx.ellipse(3,11,13,9,0,0,Math.PI*2);ctx.fill();

 ctx.fillStyle=wingC;ctx.beginPath();
 if(style==="fire"){ctx.moveTo(-1,3);ctx.lineTo(4,-35-f);ctx.lineTo(15,-24);ctx.lineTo(30,-31);ctx.lineTo(24,-6);ctx.quadraticCurveTo(10,5,-1,8);}
 else if(style==="ice"){ctx.moveTo(-1,3);ctx.lineTo(0,-37-f);ctx.lineTo(13,-25);ctx.lineTo(27,-36);ctx.lineTo(24,-5);ctx.quadraticCurveTo(10,4,-1,8);}
 else if(style==="forest"){ctx.moveTo(-1,3);ctx.quadraticCurveTo(-2,-31-f,8,-24);ctx.lineTo(16,-34);ctx.lineTo(23,-10);ctx.quadraticCurveTo(10,5,-1,8);}
 else if(style==="shadow"){ctx.moveTo(-1,3);ctx.lineTo(-9,-33-f);ctx.lineTo(6,-24);ctx.lineTo(18,-38);ctx.lineTo(29,-8);ctx.quadraticCurveTo(10,4,-1,8);}
 else if(style==="gold"){ctx.moveTo(-1,3);ctx.lineTo(5,-34-f);ctx.lineTo(17,-23);ctx.lineTo(27,-30);ctx.lineTo(24,-5);ctx.quadraticCurveTo(10,4,-1,8);}
 else {ctx.moveTo(-1,3);ctx.quadraticCurveTo(2,-33-f,28,-9);ctx.quadraticCurveTo(10,4,-1,8);}
 ctx.fill();

 ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(21,-2,17,14,.05,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(32,3,10,7,.05,0,Math.PI*2);ctx.fill();

 ctx.fillStyle=d.accent;
 if(style==="forest"){ctx.strokeStyle=d.accent;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(10,-8);ctx.lineTo(5,-28);ctx.moveTo(20,-9);ctx.lineTo(31,-28);ctx.stroke();}
 else if(style==="shadow"){ctx.beginPath();ctx.moveTo(8,-10);ctx.lineTo(4,-31);ctx.lineTo(15,-18);ctx.lineTo(23,-37);ctx.lineTo(29,-8);ctx.fill();}
 else {ctx.beginPath();ctx.moveTo(9,-10);ctx.lineTo(6,-31);ctx.lineTo(16,-15);ctx.lineTo(23,-35);ctx.lineTo(29,-9);ctx.fill();}

 ctx.fillStyle=d.eye;ctx.beginPath();ctx.ellipse(25,-4,5.5,5.8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#151426";ctx.beginPath();ctx.arc(26,-4,2.5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(27,-5.2,1.1,0,Math.PI*2);ctx.fill();

 ctx.strokeStyle=body;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(33,3,4,.2,1.1);ctx.stroke();
 ctx.restore();
}

function loop(ts){
 var dt=Math.min(.033,last?(ts-last)/1000:.016);last=ts;
 if(wing>0)wing=Math.max(0,wing-dt*3);
 if(state==="play"&&!paused){
  dragon.vy+=1550*dt;dragon.y+=dragon.vy*dt;dragon.rot=Math.max(-.5,Math.min(1,dragon.vy/700));scroll+=200*dt;
  var speed=200+Math.min(150,score*6);
  for(var i=0;i<pipes.length;i++){pipes[i].x-=speed*dt;if(!pipes[i].passed&&pipes[i].x+74<dragon.x){pipes[i].passed=true;score++;coins+=2;scoreEl.textContent=String(score);beep(980,.04);}}
  if(pipes[0].x<-110)pipes.shift(),pipes.push(makePipe(pipes[pipes.length-1].x+Math.max(270,W*.5)));
  var gy=H-82;
  if(dragon.y+16>gy||dragon.y<10)die();
  for(var k=0;k<pipes.length;k++){var p=pipes[k];if(dragon.x+18>p.x&&dragon.x-16<p.x+74&&(dragon.y-14<p.top||dragon.y+14>p.top+190)){die();break;}}
 }else if(state==="ready"){
  dragon.y=H*.42+Math.sin(ts/280)*10;dragon.rot=0;scroll+=25*dt;
 }else if(state==="dead"){
  dragon.vy+=1550*dt;dragon.y=Math.min(H-96,dragon.y+dragon.vy*dt);dragon.rot=Math.min(1.2,dragon.rot+dt*2.5);
 }
 drawBackground();drawPipes();drawGround();drawDragon();requestAnimationFrame(loop);
}

function showScreen(id){
 var screens=document.querySelectorAll(".screen");
 for(var i=0;i<screens.length;i++)screens[i].classList.toggle("active",screens[i].id===id);
 overlay.className="";
}
function thumb(d){
 var bg="linear-gradient(135deg,"+d.body+","+d.wing+")";
 return '<div class="thumb" style="background:'+bg+'"><div style="font-size:60px;text-align:center;line-height:110px;filter:drop-shadow(0 0 10px '+d.wing+')">🐉</div></div>';
}
function render(){
 var dc=document.getElementById("dragonCards"),sc=document.getElementById("shopCards"),sw=document.getElementById("swatches"),ml=document.getElementById("mapsList");
 var a="",b="",c="",m="";
 for(var i=0;i<dragons.length;i++){var d=dragons[i],own=owned.has(d.id);a+='<div class="card '+(selectedDragon===d.id?"selected":"")+'">'+thumb(d)+'<b>'+d.name+'</b><small>'+(own?"Owned":d.price+" coins")+'</small><button data-dragon="'+d.id+'" class="'+(own?"":"buy")+'">'+(own?(selectedDragon===d.id?"Selected":"Select"):"Unlock")+'</button></div>';}
 for(var j=1;j<dragons.length;j++){var q=dragons[j],o=owned.has(q.id);b+='<div class="card">'+thumb(q)+'<b>'+q.name+'</b><small>'+q.price+" coins</small><button data-dragon='"+q.id+"' class='"+(o?"":"buy")+"'>"+(o?"Select":"Unlock")+"</button></div>";}
 for(var k=0;k<colors.length;k++){var co=colors[k];c+='<button class="swatch '+(selectedColor===co.id?"selected":"")+'" data-color="'+co.id+'" style="background:linear-gradient(135deg,'+co.body+','+co.wing+')"><span>'+co.name+"</span></button>";}
 for(var n=0;n<maps.length;n++){var mp=maps[n];m+='<button class="map '+(selectedMap===mp.id?"selected":"")+'" data-map="'+mp.id+'" style="background:linear-gradient(135deg,'+mp.a+','+mp.b+')"><b>'+mp.name+'</b><small>'+mp.desc+"</small></button>";}
 dc.innerHTML=a;sc.innerHTML=b;sw.innerHTML=c;ml.innerHTML=m;
}
document.addEventListener("click",function(e){
 var t=e.target;
 if(t.matches("[data-screen]")){showScreen(t.getAttribute("data-screen"));return;}
 if(t.matches("[data-home]")){showScreen("home");return;}
 if(t.matches("[data-dragon]")){
  var id=t.getAttribute("data-dragon"),d=null;
  for(var i=0;i<dragons.length;i++)if(dragons[i].id===id)d=dragons[i];
  if(!owned.has(id)){if(coins<d.price){showToast("Not enough coins");return;}coins-=d.price;owned.add(id);showToast("Dragon unlocked!");}
  selectedDragon=id;save();render();return;
 }
 if(t.matches("[data-color]")){selectedColor=t.getAttribute("data-color");save();render();showToast("Color selected");return;}
 if(t.matches("[data-map]")){selectedMap=t.getAttribute("data-map");save();render();showToast("Map selected");return;}
});
document.getElementById("play").addEventListener("click",startGame);
document.getElementById("pause").addEventListener("click",function(){if(state==="play"){paused=!paused;pauseBtn.textContent=paused?"▶":"Ⅱ";showToast(paused?"Paused":"Resumed");}});
document.getElementById("sound").addEventListener("click",function(){muted=!muted;save();this.innerHTML="<i>"+(muted?"🔇":"🔊")+"</i>Sound";});
document.getElementById("reset").addEventListener("click",function(){localStorage.clear();location.reload();});
window.addEventListener("pointerdown",function(e){if(overlay.className==="hidden"&&!e.target.closest("button"))flap();});
window.addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();flap();}});
bestEl.textContent=String(best);
render();resetGame();requestAnimationFrame(loop);
})();
</script>
</body>
